/* ==================== 主播对比（按维度分板块） ==================== */
function renderHost(){
  const list = STORE.byHost();
  const curHost = (STORE.get(ST.curId)||{}).hostName || ST.hostName;

  if(!list.length){
    document.getElementById('scroll').innerHTML = `
      <div class="card"><div class="empty-lib">
        <div class="big">☺</div>
        <div style="font-size:14px;color:var(--text-2);margin-bottom:6px">还没有主播数据</div>
        <div style="font-size:12px;line-height:1.7">导入数据时填上主播名，这里就会自动按主播聚合对比。</div>
        <div class="mt12"><button class="btn pri" onclick="go('import')">去导入</button></div>
      </div></div>`;
    return;
  }
  if(list.length<2){
    document.getElementById('scroll').innerHTML = `
      <div class="card"><div class="empty-lib">
        <div class="big">☺</div>
        <div style="font-size:14px;color:var(--text-2);margin-bottom:6px">目前只有 1 位主播（${esc(list[0].name)}，${list[0].sessions} 场）</div>
        <div style="font-size:12px;line-height:1.7">
          主播对比需要 2 位以上主播才有意义。<br>
          导入其他主播的场次时，把主播名填成对应的人即可自动分组。</div>
        <div class="mt12"><button class="btn pri" onclick="go('import')">再导入一位主播的场次</button></div>
      </div></div>`;
    return;
  }

  const enriched = list.map(x=>({...x, current: x.name===curHost}));
  const maxUv = Math.max(...enriched.map(x=>x.uv), 0.1);
  const best = enriched.slice().sort((a,b)=>b.uv-a.uv)[0];

  const tab = curTab('host');
  let h = '';
  if(tab==='rank') h += hostRank(enriched, maxUv, list.length);
  else h += hostProfile(enriched, list.length, best);

  document.getElementById('scroll').innerHTML = h;
}

/* 板块 1：效率排行 */
function hostRank(enriched, maxUv, n){
  let h = `<div class="warn" style="background:var(--blue-bg);color:#1A4A7A">
    <b>主播对比的作用</b>：同一货盘下不同主播的效率差异，能区分「货的问题」和「人的问题」。
    如果换主播后转化明显变化，说明是人的问题；如果所有主播都低，说明是货或流量的问题。
    当前已按你导入的场次自动分组，共 ${n} 位。
  </div>`;

  h += `<div class="card">
    <div class="ch"><div class="ct">主播效率排行</div>
      <div class="cs">UV价值 = 单流量变现能力，最能反映主播水平</div></div>
    <div class="tb-wrap"><table><thead><tr>
      <th>主播</th><th class="num">场次</th><th class="num">场均 GMV</th><th class="num">UV价值</th>
      <th class="num">平均停留</th><th class="num">转化率</th><th class="num">退款率</th>
      <th class="num">健康分</th>
    </tr></thead><tbody>`;
  enriched.forEach(x=>{
    const uvBar = x.uv/maxUv*100;
    const avgGmv = x.sessions ? x.gmv/x.sessions : 0;
    h += `<tr ${x.current?'style="background:var(--blue-bg)"':''}>
      <td style="font-weight:${x.current?'600':'400'}">${esc(x.name)}${x.current?' <span class="badge b-blue">当前</span>':''}</td>
      <td class="num">${x.sessions}</td>
      <td class="num">¥${Math.round(avgGmv).toLocaleString()}</td>
      <td class="num"><div style="display:flex;align-items:center;gap:6px;justify-content:flex-end">
        <div style="width:46px;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden">
          <i style="display:block;height:100%;width:${uvBar}%;background:var(--blue)"></i></div>
        <span style="font-weight:600">¥${x.uv}</span></div></td>
      <td class="num">${x.stay}s</td>
      <td class="num">${x.cvr}%</td>
      <td class="num" style="color:${x.refund>7?'var(--red)':'inherit'}">${x.refund}%</td>
      <td class="num" style="font-weight:600;color:${x.score>=85?'var(--green)':x.score>=70?'var(--blue)':'var(--amber)'}">${x.score}</td>
    </tr>`;
  });
  h += `</tbody></table></div>
    <div class="note" style="font-size:11px;margin-top:10px">
      排序按健康分。注意看「场次」列——场次少的样本不够，单场波动可能造成误判，至少 3 场以上再下结论。
    </div>
  </div>`;

  /* 逐项最强 */
  const byUv = enriched.slice().sort((a,b)=>b.uv-a.uv)[0];
  const byStay = enriched.slice().sort((a,b)=>b.stay-a.stay)[0];
  const byCvr = enriched.slice().sort((a,b)=>b.cvr-a.cvr)[0];
  const byRefund = enriched.slice().filter(x=>x.refund>0).sort((a,b)=>a.refund-b.refund)[0];
  const strongest = [
    ['UV 价值最高', byUv, '¥'+byUv.uv, '综合变现能力最强'],
    ['停留最长', byStay, byStay.stay+'s', '话术与节奏把控最好'],
    ['转化最高', byCvr, byCvr.cvr+'%', '逼单促单能力最强'],
    ['退款最低', byRefund, byRefund?byRefund.refund+'%':'—', '承诺更实在，售后压力小'],
  ].filter(x=>x[1]);
  h += `<div class="card mt12">
    <div class="ch"><div class="ct">分项最强 <span class="tagline">谁擅长什么</span></div></div>
    <div class="g4" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
      ${strongest.map(([label,who,val,why])=>`
        <div style="padding:10px 11px;background:var(--surface-2);border-radius:var(--radius-sm)">
          <div style="font-size:10.5px;color:var(--text-3);margin-bottom:4px">${label}</div>
          <div style="font-size:13px;font-weight:600">${esc(who.name)}</div>
          <div style="font-size:15px;font-weight:600;color:var(--blue);margin-top:2px">${val}</div>
          <div style="font-size:10.5px;color:var(--text-3);margin-top:4px;line-height:1.5">${why}</div>
        </div>`).join('')}
    </div>
  </div>`;
  return h;
}

/* 板块 2：能力诊断 */
function hostProfile(enriched, n, best){
  const curRec = enriched.find(x=>x.current) || enriched[0];
  const avgUv = enriched.reduce((a,b)=>a+b.uv,0)/enriched.length;
  const avgStay = enriched.reduce((a,b)=>a+b.stay,0)/enriched.length;
  const avgCvr  = enriched.reduce((a,b)=>a+b.cvr,0)/enriched.length;
  const avgRef  = enriched.filter(x=>x.refund>0).reduce((a,b,c,arr)=>a+b.refund/arr.length,0);
  const rank = enriched.slice().sort((a,b)=>b.uv-a.uv).findIndex(x=>x.name===curRec.name)+1;

  const dims = [
    ['UV 价值','¥'+curRec.uv, '¥'+avgUv.toFixed(1), curRec.uv-avgUv, true],
    ['平均停留', curRec.stay+'s', avgStay.toFixed(1)+'s', curRec.stay-avgStay, true],
    ['转化率', curRec.cvr+'%', avgCvr.toFixed(1)+'%', curRec.cvr-avgCvr, true],
    ['退款率', curRec.refund+'%', avgRef.toFixed(1)+'%', curRec.refund-avgRef, false],
  ];

  let h = `<div class="grid g3">
    <div class="card">
      <div class="ch"><div class="ct">当前主播定位</div></div>
      <div class="note" style="font-size:11.5px">
        <b>${esc(curRec.name)}</b> 在 ${n} 位主播中 UV 价值排名 <b>第 ${rank}</b>。<br>
        UV 价值 <b>¥${curRec.uv}</b>，主播均值 <b>¥${avgUv.toFixed(1)}</b>，
        ${curRec.uv>avgUv?'<span style="color:var(--green)">高于均值</span>':'<span style="color:var(--red)">低于均值</span>'}。<br>
        累计 ${curRec.sessions} 场，场均 GMV ¥${Math.round(curRec.gmv/curRec.sessions).toLocaleString()}。
      </div>
    </div>
    <div class="card">
      <div class="ch"><div class="ct">能力对比 <span class="tagline">vs 主播均值</span></div></div>
      ${dims.map(([label,v,a,d,big])=>{
        const good = big ? d>0 : d<0;
        return `<div style="display:flex;align-items:baseline;justify-content:space-between;
          padding:4.5px 0;border-bottom:1px dashed var(--border);font-size:11.5px">
          <span style="color:var(--text-3)">${label}</span>
          <span><b style="font-weight:600">${v}</b>
            <span style="color:var(--text-3);margin-left:6px">均值 ${a}</span>
            <span class="${Math.abs(d)<1?'flat':(good?'down':'up')}" style="margin-left:6px;font-size:10.5px">
              ${Math.abs(d)<1?'≈':(d>0?'▲':'▼')}${Math.abs(d).toFixed(1)}</span></span>
        </div>`;
      }).join('')}
      <div class="muted mt8" style="font-size:10.5px;line-height:1.6">
        UV 价值=综合变现 · 停留=节奏把控 · 转化=促单能力 · 退款=承诺是否过度
      </div>
    </div>
    <div class="card">
      <div class="ch"><div class="ct">排班建议</div></div>
      <div class="note" style="font-size:11.5px">
        效率最高的 <b>${esc(best.name)}</b>（UV ¥${best.uv}）安排在流量高位时段；<br>
        流量平稳时段安排新人练手，减少机会成本；<br>
        大促场次必须用效率最优组合。<br><br>
        <span style="color:var(--text-3)">判断依据：同货盘下换人后指标变化 → 是人的问题；所有人都低 → 是货或流量的问题。</span>
      </div>
    </div>
  </div>`;

  /* 主播 × 问题类型：谁在哪类问题上失分最多 */
  h += `<div class="card mt12">
    <div class="ch"><div class="ct">能力短板提示</div>
      <div class="cs">按四项指标相对均值定位</div></div>
    <div style="font-size:11.5px;line-height:1.75">`;
  const weak = dims.filter(([l,v,a,d,big])=> (big? d<-1 : d>1));
  if(weak.length){
    h += weak.map(([label,v,a,d,big],i)=>{
      const advice = {
        'UV 价值':'同样流量变现更少，优先复盘排品顺序与整场的价值塑造节奏。',
        '平均停留':'留不住人，重点看开场 10 秒的钩子和每 15 分钟的互动节点。',
        '转化率':'人留住了但没下单，检查价格锚点是否讲清、逼单节点是否明确。',
        '退款率':'退款偏高，可能是口播与详情页不一致，或过度承诺了发货时效。',
      }[label];
      return `<b>${i+1}. ${label} 弱于主播均值 ${Math.abs(d).toFixed(1)}</b><br>
        <span style="color:var(--text-3)">${advice}</span>`;
    }).join('<br><br>');
  } else {
    h += `四项指标均在主播均值附近，暂无明显短板。可以安排其带教其他主播，或增加排班场次放大产出。`;
  }
  h += `</div></div>`;
  return h;
}

/* 真实趋势解读：用首尾斜率判断方向 */
function renderTrendInsight(ordered){
  const n = ordered.length;
  const first = ordered[0].snapshot, last = ordered[n-1].snapshot;
  const half = Math.max(1, Math.floor(n/2));
  const avgOf = (arr,k)=>{ const v=arr.map(x=>x.snapshot[k]).filter(x=>x!=null); return v.length?v.reduce((a,b)=>a+b,0)/v.length:0; };
  const early = ordered.slice(0,half), late = ordered.slice(-half);

  const rows = [
    ['健康分','score','',false],
    ['GMV','gmv','¥',false],
    ['UV价值','uv','¥',false],
    ['平均停留','stay','s',false],
    ['转化率','cvr','%',false],
    ['退款率','refund','%',true],
  ].map(([label,key,p,inv])=>{
    const a = avgOf(early,key), b = avgOf(late,key);
    const d = a ? (b-a)/a*100 : 0;
    const good = inv ? d<0 : d>0;
    return {label,key,p,inv,d,a,b,good};
  });
  const ups = rows.filter(r=>r.d>2 && r.good);
  const downs = rows.filter(r=>r.d<-2 && !r.good);

  let h = `<div class="note"><b>趋势解读</b>：把 ${n} 场按前后两半对比，`;
  h += `提升最明显的是 `;
  if(ups.length){
    h += ups.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,3)
      .map(r=>`<b style="color:var(--green)">${r.label} +${Math.abs(r.d).toFixed(0)}%</b>`).join('、');
  } else h += `<span class="muted">无明显提升项</span>`;
  h += `；`;
  h += `需要警惕的是 `;
  if(downs.length){
    h += downs.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,3)
      .map(r=>`<b style="color:var(--red)">${r.label} ${r.d>0?'+':''}${r.d.toFixed(0)}%</b>`).join('、');
  } else h += `<span class="muted">无明显恶化项</span>`;
  h += `。`;

  // 健康分方向
  if(first.score!=null && last.score!=null){
    const ds = last.score-first.score;
    h += `<br>最新一场健康分 <b>${last.score}</b>，`;
    h += Math.abs(ds)<3 ? `与首场基本持平，能力稳定。`
      : (ds>0 ? `<span style="color:var(--green)">比首场高 ${ds} 分，整体在进步</span>。`
              : `<span style="color:var(--red)">比首场低 ${Math.abs(ds)} 分，需要复盘近期改动</span>。`);
  }
  h += `</div>`;

  /* 前后两半逐项对照表 */
  h += `<div class="card mt12">
    <div class="ch"><div class="ct">前后两半对照</div>
      <div class="cs">前 ${half} 场 vs 后 ${half} 场均值</div></div>
    <div class="tb-wrap"><table><thead><tr>
      <th>指标</th><th class="num">前半段</th><th class="num">后半段</th><th style="text-align:right">变化</th>
    </tr></thead><tbody>
    ${rows.map(r=>{
      const good = r.inv ? r.d<0 : r.d>0;
      const cls = Math.abs(r.d)<2 ? 'flat' : (good?'down':'up');
      const fmt = v => r.key==='gmv' ? '¥'+Math.round(v).toLocaleString()
        : (r.key==='score' ? v.toFixed(0) : (+v).toFixed(1));
      return `<tr><td>${r.label}</td>
        <td class="num" style="color:var(--text-2)">${fmt(r.a)}</td>
        <td class="num" style="font-weight:600">${fmt(r.b)}</td>
        <td style="text-align:right"><span class="${cls}">${Math.abs(r.d)<2?'—':(r.d>0?'▲':'▼')}${Math.abs(r.d).toFixed(1)}%</span></td></tr>`;
    }).join('')}
    </tbody></table></div>
    <div class="note" style="font-size:11px;margin-top:10px">
      看前后两半的对比，比看「最新一场 vs 上一场」更稳——单场波动容易被偶然因素干扰。
    </div>
  </div>`;
  return h;
}

/* 指标相关性：找出哪两个指标真正同向变动 */
function trendCorrelation(ordered){
  const pairs = [
    ['平均停留','转化率','stay','cvr','停留留住了人，转化才可能上来'],
    ['平均停留','UV价值','stay','uv','停留通过率影响单位流量产出'],
    ['进入率','平均停留','entry','stay','进得来的人对，停留才有基础'],
    ['付费占比','UV价值','paid','uv','付费流量是否比自然流量更划算'],
  ];
  const res = pairs.map(([ln,rn,lk,rk,why])=>{
    const arr = ordered
      .map(x=>[x.snapshot[lk], x.snapshot[rk]])
      .filter(([a,b])=>a!=null&&b!=null&&a!==0&&b!==0);
    if(arr.length<4) return {ln,rn,r:null,n:arr.length,why};
    const mx = arr.reduce((a,b)=>a+b[0],0)/arr.length;
    const my = arr.reduce((a,b)=>a+b[1],0)/arr.length;
    let num=0,dx=0,dy=0;
    arr.forEach(([x,y])=>{ num+=(x-mx)*(y-my); dx+=(x-mx)**2; dy+=(y-my)**2; });
    const r = (dx&&dy) ? num/Math.sqrt(dx*dy) : 0;
    return {ln,rn,r,n:arr.length,why};
  });
  const valid = res.filter(x=>x.r!=null);

  const head = `<div class="ch"><div class="ct">指标相关性 <span class="tagline">谁在带动谁</span></div>
    <div class="cs">基于你 ${ordered.length} 场真实数据</div></div>`;

  if(!valid.length){
    return `<div class="card mt12">${head}
      <div class="empty">样本不足<br><span style="font-size:11px">至少需要 4 场同时含这两项指标的数据</span></div>
    </div>`;
  }

  let h = `<div class="card mt12">${head}`;
  h += `<div class="tb-wrap"><table><thead><tr>
    <th>指标组合</th><th class="num">相关系数</th><th>关系</th><th>解读</th>
  </tr></thead><tbody>`;
  valid.forEach(x=>{
    const a = Math.abs(x.r);
    const strength = a>=0.7?'强':(a>=0.4?'中等':'弱');
    const dir = x.r>0?'正':'负';
    const col = a<0.4 ? 'var(--text-3)' : (x.r>0?'var(--green)':'var(--red)');
    h += `<tr>
      <td>${x.ln} ↔ ${x.rn}</td>
      <td class="num" style="font-weight:600;color:${col}">${x.r.toFixed(2)}</td>
      <td><span class="badge ${a<0.4?'b-gray':(x.r>0?'b-green':'b-red')}">${strength}${dir}相关</span></td>
      <td style="font-size:11px;color:var(--text-2)">${x.why}</td></tr>`;
  });
  h += `</tbody></table></div>`;

  const strong = valid.filter(x=>Math.abs(x.r)>=0.6);
  h += `<div class="note" style="font-size:11px;margin-top:11px">`;
  if(strong.length){
    const s0 = strong.sort((a,b)=>Math.abs(b.r)-Math.abs(a.r))[0];
    h += `<b>你的数据里最强的关联是「${s0.ln} ↔ ${s0.rn}」（${s0.r.toFixed(2)}）</b>。` +
      (s0.r>0
        ? `这意味着抓${s0.ln}能带动${s0.rn}——把${s0.ln}当成本周的核心改善指标，比直接盯 GMV 更有效。`
        : `两者反向变动，通常意味着用促销/秒杀硬拉一个指标时牺牲了另一个，需要复核节奏。`);
  } else {
    h += `目前各项指标之间没有明显强相关（都低于 0.6），说明你的表现波动更多来自外部因素（流量结构、排品、时段）而不是单一可控指标。建议把场次样本积累到 8 场以上再看相关性。`;
  }
  h += `</div></div>`;
  return h;
}

function trendKpi2(label,key,p,ordered,inv){
  const n = ordered.length;
  const v = ordered[n-1].snapshot[key]||0;
  const prevV = ordered[n-2] ? (ordered[n-2].snapshot[key]||0) : null;
  const gap = prevV ? (v-prevV)/prevV*100 : 0;
  const good = inv?gap<0:gap>0;
  const cls = Math.abs(gap)<2?'flat':(good?'down':'up');
  const vals = ordered.map(x=>x.snapshot[key]||0);
  const mx = Math.max(...vals), mn = Math.min(...vals);
  const show = val => key==='gmv' ? Math.round(val).toLocaleString() : val.toFixed(2);
  return `<div class="kpi">
    <div class="kpi-l">${label} <span class="muted">近 ${n} 场</span></div>
    <div class="kpi-v">${p}${show(v)}</div>
    <div class="kpi-d">${prevV!=null?`<span class="${cls}">${Math.abs(gap)<2?'—':(gap>0?'▲':'▼')}${Math.abs(gap).toFixed(1)}%</span><span class="muted">环比上场</span>`:'<span class="muted">首场</span>'}</div>
    <div class="muted" style="margin-top:5px;font-size:10px">区间 ${p}${show(mn)} – ${p}${show(mx)}</div>
  </div>`;
}

/* 问题标题 → 建议验证指标 */
function issVerify(title){
  const rules = [
    [/停留/, '平均停留时长是否回到类目基准以上'],
    [/退款/, '退款率是否降到基准以内'],
    [/转化|成交/, '成交转化率是否回到基准以上'],
    [/时段|洼地/, '低效时段数量是否减少'],
    [/品|讲解|排品/, '低效品讲解段数是否压缩'],
    [/付费/, '付费流量占比是否下降'],
    [/UV/, 'UV 价值是否回升'],
    [/流量来源|来源/, '自然流量占比是否提升'],
  ];
  for(const [re, v] of rules){ if(re.test(title)) return v; }
  return '下场的健康分是否回升';
}

  </div>`;

  h += `<div class="grid g4">
    <div class="kpi"><div class="kpi-l">结构性问题</div>

  return h;
}

      <div class="note" style="font-size:11.5px">

      <div class="ct mb8">开播前检查清单</div>

        ${(()=>{
          const items = [];
          const has = kw => trends.some(x=>x.title.includes(kw) || (x.key&&x.key.includes(kw)));
          if(has('停留'))   items.push('开场前 10 分钟排期已确认（福利款 + 价格锚点）');

/* ==================== 图表 ==================== */
function setupCanvas(cv, H){
  const box = cv.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const W = box.clientWidth || 600;
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  return {ctx, W, H};
}

function drawChart(M){
  const cv = document.getElementById('cv'); if(!cv) return;
  const H = 170;
  const {ctx, W} = setupCanvas(cv, H);
  const d = M.timeline;
  const pad = {l:50,r:14,t:16,b:24};
  const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  const maxOn = Math.max(...d.map(p=>p.online||0),1)*1.15;
  const maxG = Math.max(...d.map(p=>p.gmv||0),1)*1.3;

  ctx.strokeStyle='#EDEDE9'; ctx.lineWidth=1;
  ctx.font='10px -apple-system,sans-serif'; ctx.fillStyle='#8C8B85';
  for(let i=0;i<=4;i++){
    const y=pad.t+ch*i/4;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+cw,y); ctx.stroke();
    ctx.textAlign='right'; ctx.fillText(kfmt(maxOn*(4-i)/4), pad.l-6, y+3);
  }
  const X=i=>pad.l+(d.length>1?cw*i/(d.length-1):cw/2);
  const Yon=v=>pad.t+ch*(1-v/maxOn);

  const bw=Math.max(cw/d.length*0.5,2);
  d.forEach((p,i)=>{
    if(!p.gmv) return;
    const x=X(i)-bw/2, y=pad.t+ch*(1-p.gmv/maxG);
    ctx.fillStyle='rgba(192,57,43,0.45)';
    ctx.fillRect(x,y,bw,pad.t+ch-y);
  });

  ctx.beginPath(); ctx.strokeStyle='#21578E'; ctx.lineWidth=2;
  ctx.lineJoin='round'; ctx.lineCap='round';
  d.forEach((p,i)=>{ const x=X(i),y=Yon(p.online||0); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();
  ctx.lineTo(X(d.length-1),pad.t+ch); ctx.lineTo(X(0),pad.t+ch); ctx.closePath();
  ctx.fillStyle='rgba(33,87,142,0.06)'; ctx.fill();

  // 拐点
  const marks=[];
  let pk=0; d.forEach((p,i)=>{ if((p.online||0)>(d[pk].online||0)) pk=i; });
  if(d[pk]&&d[pk].online) marks.push({i:pk,c:'#276B4E',lb:'峰值'});
  for(let i=1;i<d.length;i++){
    if(d[i-1].online && d[i].online && d[i].online<d[i-1].online*0.75){
      marks.push({i,c:'#C0392B',lb:'骤降'}); break;
    }
  }
  for(let i=1;i<d.length;i++){
    if(d[i-1].online && d[i].online && d[i].online/d[i-1].online>1.4){
      marks.push({i,c:'#21578E',lb:'起量'}); break;
    }
  }
  marks.forEach(m=>{
    const x=X(m.i), y=Yon(d[m.i].online||0);
    ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.lineWidth=2.2; ctx.strokeStyle=m.c; ctx.stroke();
    ctx.fillStyle=m.c; ctx.font='600 10px -apple-system,sans-serif'; ctx.textAlign='center';
    ctx.fillText(m.lb,x,y-10);
  });

  ctx.fillStyle='#8C8B85'; ctx.font='10px -apple-system,sans-serif'; ctx.textAlign='center';
  const step=Math.max(1,Math.ceil(d.length/8));
  d.forEach((p,i)=>{ if(i%step===0) ctx.fillText(p.label,X(i),H-7); });
}

/* 场次对比页走势：真实仓库序列，本场高亮 */
function drawStoreTrend(curId){
  const ordered = STORE.ordered();
  const data = ordered.map(x=>({
    date: x.date,
    gmv: x.snapshot.gmv,
    uv: x.snapshot.uv,
    score: x.snapshot.score||0,
    __cur: x.id===curId,
  }));
  drawMulti('cvTrend', data, ['gmv','uv','score'], ['GMV','UV价值','健康分'], ['#21578E','#C0392B','#B8791A']);
  // 高亮本场：在折线上方画一个标记
  const cv = document.getElementById('cvTrend'); if(!cv) return;
  const idx = ordered.findIndex(x=>x.id===curId);
  if(idx<0) return;
  const H = cv.parentElement.clientHeight||210;
  const W = cv.width / (window.devicePixelRatio||1);
  const pad={l:50,r:14,t:16,b:24};
  const cw=W-pad.l-pad.r;
  const x = pad.l + (ordered.length>1 ? cw*idx/(ordered.length-1) : cw/2);
  const ctx = cv.getContext('2d');
  ctx.save();
  ctx.setLineDash([3,3]); ctx.strokeStyle='#21578E'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,H-pad.b); ctx.stroke();
  ctx.restore();
  ctx.fillStyle='#21578E'; ctx.font='600 10px -apple-system,sans-serif'; ctx.textAlign='center';
  ctx.fillText('本场', x, pad.t-4);
}

function drawMulti(id, data, keys, labels, colors){
  const cv = document.getElementById(id); if(!cv) return;
  const H = cv.parentElement.clientHeight || 190;
  const {ctx, W} = setupCanvas(cv, H);
  const pad={l:50,r:14,t:16,b:24};
  const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  const ranges = keys.map(k=>{
    const v = data.map(d=>d[k]||0);
    return {max:Math.max(...v,1)*1.15, min:Math.min(...v)};
  });

  ctx.strokeStyle='#EDEDE9'; ctx.lineWidth=1;
  ctx.font='10px -apple-system,sans-serif'; ctx.fillStyle='#8C8B85';
  for(let i=0;i<=4;i++){
    const y=pad.t+ch*i/4;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+cw,y); ctx.stroke();
    ctx.textAlign='right'; ctx.fillText(kfmt(ranges[0].max*(4-i)/4), pad.l-6, y+3);
  }
  const X=i=>pad.l+(data.length>1?cw*i/(data.length-1):cw/2);

  keys.forEach((k,ki)=>{
    const r = ranges[ki];
    ctx.beginPath(); ctx.strokeStyle=colors[ki]; ctx.lineWidth=2;
    ctx.lineJoin='round'; ctx.lineCap='round';
    data.forEach((d,i)=>{
      const x=X(i), y=pad.t+ch*(1-(d[k]||0)/r.max);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();
    data.forEach((d,i)=>{
      const x=X(i), y=pad.t+ch*(1-(d[k]||0)/r.max);
      ctx.beginPath(); ctx.arc(x,y,2.5,0,Math.PI*2);
      ctx.fillStyle=colors[ki]; ctx.fill();
    });
  });

  ctx.fillStyle='#8C8B85'; ctx.font='10px -apple-system,sans-serif'; ctx.textAlign='center';
  const step=Math.max(1,Math.ceil(data.length/7));
  data.forEach((d,i)=>{ if(i%step===0) ctx.fillText(d.date,X(i),H-7); });
}

function kfmt(v){
  if(v>=10000) return (v/10000).toFixed(1)+'万';
  if(v>=1000) return (v/1000).toFixed(1)+'k';
  return Math.round(v);
}
