<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复盘台 · 直播运营作战系统</title>
<style>
  :root{
    --bg:#F5F5F3; --surface:#FFFFFF; --surface-2:#F0F0EC; --surface-3:#E8E8E3;
    --border:#E2E2DC; --border-strong:#CFCFC7;
    --text:#191917; --text-2:#565651; --text-3:#8C8B85;
    --red:#C0392B; --red-bg:#FCEDEB; --red-line:#E8B4AC;
    --amber:#A8701A; --amber-bg:#FCF3E2; --amber-line:#E8D5A8;
    --green:#276B4E; --green-bg:#E8F3ED; --green-line:#B8D6C6;
    --blue:#21578E; --blue-bg:#E9F0F9; --blue-line:#B4CBE4;
    --purple:#5F4595; --purple-bg:#EFEBF9; --purple-line:#CBBFE8;
    --radius:10px; --radius-sm:7px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:13px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;height:100vh;overflow:hidden}

  /* ===== 侧栏 ===== */
  .side{width:190px;flex-shrink:0;background:#1C1C1A;color:#E8E8E3;
    display:flex;flex-direction:column;overflow-y:auto}
  .brand{padding:16px 16px 14px;border-bottom:1px solid #2E2E2B}
  .brand h1{font-size:14px;font-weight:600;letter-spacing:-.1px;color:#fff}
  .brand p{font-size:10.5px;color:#8C8B85;margin-top:2px}
  .nav{padding:10px 8px;flex:1}
  .nav-sec{font-size:10px;color:#6B6B66;padding:10px 8px 5px;letter-spacing:.5px}
  .nav-i{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;
    font-size:12.5px;color:#B8B8B3;cursor:pointer;transition:all .1s;user-select:none;margin-bottom:1px}
  .nav-i:hover{background:#2A2A27;color:#fff}
  .nav-i.on{background:#333330;color:#fff;font-weight:500}
  .nav-i .ii{width:14px;text-align:center;font-size:11px;opacity:.8;flex-shrink:0}
  .nav-i .cnt{margin-left:auto;font-size:10px;background:#C0392B;color:#fff;
    padding:0 5px;border-radius:8px;line-height:15px;min-width:16px;text-align:center}
  .nav-i.dis{opacity:.34;cursor:not-allowed}
  .nav-i.dis:hover{background:transparent;color:#B8B8B3}
  .side-foot{padding:10px 14px;border-top:1px solid #2E2E2B;font-size:10px;color:#6B6B66;line-height:1.6}

  /* ===== 主区 ===== */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}

  .topbar{height:52px;flex-shrink:0;background:var(--surface);
    border-bottom:1px solid var(--border);display:flex;align-items:center;
    gap:14px;padding:0 20px;flex-wrap:nowrap;overflow-x:auto}
  .tb-title{font-size:14px;font-weight:600;white-space:nowrap}
  .tb-sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
  .tb-meta{font-size:11.5px;color:var(--text-3);white-space:nowrap}
  .tb-right{margin-left:auto;display:flex;gap:7px;flex-shrink:0}

  /* ===== 返回键 ===== */
  .tb-back{flex-shrink:0;display:flex;align-items:center}
  .tb-back:empty{display:none}
  .btn.back{border-color:var(--border-strong);font-weight:600;padding:5px 10px}
  .btn.back:hover{background:var(--surface-2)}
  .btn.back .bk-lb{display:inline-block;max-width:158px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;
    font-weight:400;opacity:.8;margin-left:5px}
  /* 窄屏（侧栏被隐藏）才出现的页面切换菜单 */
  .only-narrow{display:none !important}
  @media(max-width:960px){ .only-narrow{display:inline-flex !important} }
  .vmenu{position:fixed;top:58px;right:12px;z-index:90;background:var(--surface);
    border:1px solid var(--border-strong);border-radius:9px;padding:5px;
    box-shadow:0 12px 32px rgba(0,0,0,.18);min-width:172px;
    max-width:calc(100vw - 24px);max-height:70vh;overflow-y:auto}
  .vmenu .vm-sec{font-size:10px;color:var(--text-3);padding:7px 10px 3px;letter-spacing:.5px}
  .vmenu .vm-i{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;
    font-size:12.5px;cursor:pointer;white-space:nowrap}
  .vmenu .vm-i:hover{background:var(--surface-2)}
  .vmenu .vm-i.on{background:var(--blue-bg);color:var(--blue);font-weight:600}
  .vmenu .vm-i .ii{width:14px;text-align:center;font-size:11px;opacity:.75;flex-shrink:0}

  .btn{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;
    border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
    transition:all .1s;white-space:nowrap;font-family:inherit}
  .btn:hover{background:var(--surface-2)}
  .btn.pri{background:#1C1C1A;color:#fff;border-color:#1C1C1A}
  .btn.pri:hover{opacity:.85}
  .btn.sm{padding:4px 9px;font-size:11.5px}

  .scroll{flex:1;overflow-y:auto;padding:14px 20px 60px}

  /* ===== 子页签（维度切换条）===== */
  .tabs{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);
    display:flex;align-items:stretch;gap:1px;padding:0 16px;overflow-x:auto;
    scrollbar-width:none}
  .tabs::-webkit-scrollbar{height:0;display:none}
  .tab{flex-shrink:0;padding:0 12px;height:37px;display:inline-flex;align-items:center;gap:6px;
    font-size:12px;color:var(--text-3);cursor:pointer;white-space:nowrap;
    border-bottom:2px solid transparent;transition:color .12s,background .12s;
    user-select:none;font-family:inherit}
  .tab:hover{color:var(--text);background:var(--surface-2)}
  .tab.on{color:var(--text);font-weight:600;border-bottom-color:var(--text);background:transparent}
  .tab .tb-n{font-size:10px;background:var(--surface-3);color:var(--text-2);
    padding:0 5px;border-radius:8px;line-height:15px;min-width:16px;text-align:center;
    font-weight:500;font-variant-numeric:tabular-nums}
  .tab.on .tb-n{background:var(--text);color:#fff}
  .tab .tb-n.hot{background:var(--red);color:#fff}

  /* ===== 维度卡片（总览页的跳转入口）===== */
  .dims{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .dim{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:13px 14px;cursor:pointer;transition:border-color .12s,transform .12s;
    position:relative;overflow:hidden;min-width:0}
  .dim:hover{border-color:var(--border-strong);transform:translateY(-1px)}
  .dim-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .dim-t{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .dim-t .ii{font-size:11px;color:var(--text-3)}
  .dim-go{font-size:11px;color:var(--text-3);opacity:0;transition:opacity .12s}
  .dim:hover .dim-go{opacity:1}
  .dim-line{font-size:11.5px;color:var(--text-2);line-height:1.6;
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:3px 0;border-bottom:1px dashed var(--border)}
  .dim-line:last-child{border-bottom:0}
  .dim-line b{font-variant-numeric:tabular-nums;font-weight:600;flex-shrink:0}
  .dim-line .lb{color:var(--text-3)}
  .dim.sum{background:var(--surface-2)}
  .dim.sum:hover{transform:none;cursor:default}

  /* ===== 网格系统 ===== */
  .grid{display:grid;gap:12px;margin-bottom:12px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g21{grid-template-columns:2fr 1fr}
  .g12{grid-template-columns:1fr 2fr}
  .g31{grid-template-columns:3fr 1fr}

  .card{background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px;min-width:0}
  .card.pad0{padding:0;overflow:hidden}
  .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
  .ct{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
  .ct .tagline{font-size:10px;font-weight:500;padding:1px 6px;border-radius:4px;
    background:var(--surface-2);color:var(--text-3)}
  .cs{font-size:11px;color:var(--text-3);white-space:nowrap}

  /* ===== KPI 卡 ===== */
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 13px;position:relative;overflow:hidden}
  .kpi-l{font-size:11px;color:var(--text-3);margin-bottom:5px;display:flex;align-items:center;gap:5px}
  .kpi-v{font-size:24px;font-weight:600;letter-spacing:-.7px;line-height:1.1;
    font-variant-numeric:tabular-nums}
  .kpi-v small{font-size:12px;font-weight:400;color:var(--text-3);letter-spacing:0;margin-left:2px}
  .kpi-d{font-size:11px;margin-top:5px;display:flex;align-items:center;gap:5px}
  .kpi-bar{height:3px;border-radius:2px;background:var(--surface-3);margin-top:8px;overflow:hidden}
  .kpi-bar i{display:block;height:100%;border-radius:2px}
  .up{color:var(--red)} .down{color:var(--green)} .flat{color:var(--text-3)}
  .badge{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:500}
  .b-red{background:var(--red-bg);color:var(--red)}
  .b-amber{background:var(--amber-bg);color:var(--amber)}
  .b-green{background:var(--green-bg);color:var(--green)}
  .b-blue{background:var(--blue-bg);color:var(--blue)}
  .b-purple{background:var(--purple-bg);color:var(--purple)}
  .b-gray{background:var(--surface-2);color:var(--text-2)}

  /* ===== 健康分 ===== */
  .score-hero{display:flex;gap:16px;align-items:center}
  .ring{position:relative;width:96px;height:96px;flex-shrink:0}
  .ring-num{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center}
  .ring-num b{font-size:26px;font-weight:600;letter-spacing:-1px;line-height:1}
  .ring-num span{font-size:9.5px;color:var(--text-3);margin-top:2px}

  /* ===== 诊断行 ===== */
  .diag{display:flex;gap:9px;align-items:flex-start;padding:9px 0;
    border-bottom:1px solid var(--border)}
  .diag:last-child{border-bottom:none;padding-bottom:0}
  .dsev{width:3px;border-radius:2px;align-self:stretch;flex-shrink:0;min-height:30px}
  .dsev.high{background:var(--red)} .dsev.mid{background:var(--amber)} .dsev.low{background:var(--blue)}
  .dbody{flex:1;min-width:0}
  .dtxt{font-size:12.5px;line-height:1.45;font-weight:500}
  .dmeta{font-size:11px;color:var(--text-3);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap}
  .dnum{font-size:12.5px;font-weight:600;text-align:right;white-space:nowrap;
    font-variant-numeric:tabular-nums}

  /* ===== 表格 ===== */
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;font-size:10.5px;font-weight:600;color:var(--text-3);
    padding:7px 9px;border-bottom:1px solid var(--border);white-space:nowrap;
    background:var(--surface-2);position:sticky;top:0;z-index:1}
  td{padding:8px 9px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface-2)}
  .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:11.5px}
  .tb-wrap{max-height:none;overflow:auto}

  /* ===== 热力条 ===== */
  .heat{display:flex;gap:3px;align-items:flex-end;height:110px;padding:0 2px}
  .hbar{flex:1;min-width:5px;border-radius:2px 2px 0 0;position:relative;cursor:pointer;
    transition:opacity .12s}
  .hbar:hover{opacity:.75}
  .heat-x{display:flex;gap:3px;font-size:9.5px;color:var(--text-3);margin-top:5px;padding:0 2px}
  .heat-x span{flex:1;min-width:5px;text-align:center;overflow:hidden}

  /* ===== 四象限 ===== */
  .quad{position:relative;height:230px;border-left:1px solid var(--border);
    border-bottom:1px solid var(--border);margin:14px 8px 26px 30px}
  .qd{position:absolute;font-size:10px;color:var(--text-3);letter-spacing:.3px}
  .qpt{position:absolute;border-radius:50%;cursor:pointer;transition:transform .12s}
  .qpt:hover{transform:scale(1.35);z-index:5}
  .q-lbl{position:absolute;font-size:10.5px;color:var(--text-2);white-space:nowrap;
    transform:translate(-50%,-50%)}

  /* ===== 漏斗 ===== */
  .fun{display:flex;flex-direction:column;gap:4px}
  .fs{display:grid;grid-template-columns:96px 1fr 76px 84px;gap:10px;align-items:center}
  .fsn{font-size:11.5px;color:var(--text-2);white-space:nowrap}
  .fsw{height:20px;background:var(--surface-2);border-radius:4px;overflow:hidden}
  .fsb{height:100%;border-radius:4px;transition:width .5s}
  .fsv{font-size:11.5px;font-weight:600;text-align:right;font-family:var(--mono)}
  .fsr{font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
  .fs.break .fsn{color:var(--red);font-weight:600}
  .btag{font-size:9.5px;background:var(--red);color:#fff;padding:0 4px;
    border-radius:3px;margin-left:4px;font-weight:500}

  /* ===== 时间轴图 ===== */
  .chart{position:relative;height:170px;width:100%}
  .lg{display:flex;gap:14px;font-size:10.5px;color:var(--text-2);margin-bottom:8px;flex-wrap:wrap}
  .lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

  /* ===== 方案 ===== */
  .plan{background:var(--surface-2);border-radius:var(--radius-sm);padding:11px 12px;margin-top:9px}
  .plan-t{font-size:11.5px;font-weight:600;margin-bottom:8px;color:var(--text)}
  .step{display:flex;gap:9px;padding:5px 0;font-size:11.5px;line-height:1.5}
  .step-n{width:16px;height:16px;border-radius:50%;background:var(--text);color:#fff;
    font-size:9.5px;display:grid;place-items:center;flex-shrink:0;margin-top:1px;font-weight:600}
  .step-l{font-weight:600;color:var(--text);flex-shrink:0}
  .step-d{color:var(--text-2)}
  .tpl{margin-top:9px;padding:9px 11px;background:#1C1C1A;color:#E8E8E3;border-radius:6px;
    font-size:11.5px;line-height:1.6;position:relative}
  .tpl::before{content:'话术/模板';position:absolute;top:-7px;left:10px;
    font-size:9px;background:var(--surface-2);color:var(--text-3);padding:0 5px;border-radius:3px}
  .sched{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
  .sched th{background:transparent;border-bottom:1px solid var(--border-strong);
    font-size:10px;padding:5px 8px}
  .sched td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
  .sched tr:last-child td{border-bottom:none}
  .stime{font-family:var(--mono);font-size:10.5px;color:var(--text-2);white-space:nowrap}

  /* ===== 折叠问题卡 ===== */
  .iss{border:1px solid var(--border);border-radius:var(--radius-sm);
    margin-bottom:8px;overflow:hidden;background:var(--surface)}
  .iss-h{display:grid;grid-template-columns:3px 1fr auto auto;gap:11px;align-items:center;
    padding:11px 13px;cursor:pointer}
  .iss-h:hover{background:var(--surface-2)}
  .iss-t{font-size:12.5px;font-weight:500;line-height:1.4}
  .iss-m{font-size:10.5px;color:var(--text-3);margin-top:2px}
  .iss-a{font-size:9.5px;color:var(--text-3);transition:transform .16s}
  .iss.open .iss-a{transform:rotate(90deg)}
  .iss-b{display:none;padding:2px 13px 13px 27px}
  .iss.open .iss-b{display:block}
  .sect{margin-bottom:11px}
  .sect-l{font-size:10px;font-weight:600;color:var(--text-3);letter-spacing:.5px;margin-bottom:5px}
  .ev{background:var(--surface-2);border-radius:5px;padding:9px 11px;font-size:11.5px}
  .ev-r{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
  .ev-r b{font-weight:600;font-family:var(--mono);text-align:right}
  .sect p{font-size:12px;color:var(--text-2);line-height:1.6}
  .sect ul{margin:0;padding-left:16px}
  .sect li{font-size:12px;color:var(--text-2);margin-bottom:3px;line-height:1.5}
  .rec{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;
    background:var(--purple-bg);color:var(--purple);padding:2px 8px;border-radius:4px;
    font-weight:500;margin-bottom:9px}

  /* ===== 待办 ===== */
  .td{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start}
  .td:last-child{border-bottom:none}
  .td input{margin-top:3px;width:14px;height:14px;accent-color:#1C1C1A;cursor:pointer;flex-shrink:0}
  .td-b{flex:1;min-width:0;cursor:pointer}
  .td-t{font-size:12px;line-height:1.5}
  .td input:checked + .td-b .td-t{text-decoration:line-through;color:var(--text-3)}
  .td-tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
  .tg{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--text-2)}
  .tg.p0{background:var(--red-bg);color:var(--red);font-weight:500}
  .tg.p1{background:var(--amber-bg);color:var(--amber);font-weight:500}
  .tg.p2{background:var(--blue-bg);color:var(--blue);font-weight:500}

  /* ===== 导入 ===== */
  .imp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
  .imp{border:1.5px dashed var(--border-strong);border-radius:var(--radius-sm);
    padding:14px 11px;text-align:center;cursor:pointer;transition:all .13s;background:var(--surface)}
  .imp:hover{border-color:var(--text-3);background:var(--surface-2)}
  .imp.on{border-style:solid;border-color:var(--text);background:var(--surface-2)}
  .imp .ic{font-size:16px;margin-bottom:6px;opacity:.7}
  .imp h4{font-size:12px;font-weight:600;margin-bottom:3px}
  .imp p{font-size:10.5px;color:var(--text-3);line-height:1.4}
  textarea{width:100%;min-height:150px;padding:11px;border:1px solid var(--border-strong);
    border-radius:var(--radius-sm);font-family:var(--mono);font-size:11.5px;line-height:1.6;
    resize:vertical;background:var(--surface);color:var(--text)}
  textarea:focus{outline:none;border-color:var(--text)}
  select,.inp{padding:6px 9px;border:1px solid var(--border-strong);border-radius:6px;
    font-size:12px;background:var(--surface);color:var(--text);font-family:inherit}
  select:focus,.inp:focus{outline:none;border-color:var(--text)}
  .note{font-size:11.5px;color:var(--text-2);background:var(--surface-2);
    border-radius:var(--radius-sm);padding:11px 13px;line-height:1.65}
  .note b{color:var(--text);font-weight:600}
  .warn{font-size:11.5px;background:var(--amber-bg);color:#7A5210;border-radius:var(--radius-sm);
    padding:10px 13px;line-height:1.6;margin-bottom:11px}

  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--surface-2);
    color:var(--text-2);border:1px solid var(--border);white-space:nowrap}
  .chip.ok{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
  .chip.miss{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
  .chip.hi{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}

  .hidden{display:none!important}
  .mt8{margin-top:8px} .mt12{margin-top:12px} .mb8{margin-bottom:8px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .meta-row{padding-top:10px;border-top:1px dashed var(--border)}
  .meta-row .muted{min-width:52px}
  .muted{color:var(--text-3);font-size:11px}

  /* 场次库 */
  .lib-list{display:flex;flex-direction:column;gap:8px}
  .lib-row{display:grid;grid-template-columns:82px minmax(0,1fr) repeat(5,58px) 60px 118px;gap:9px;align-items:center;
    padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);
    transition:border-color .15s, box-shadow .15s}

    /* 场次清单在窄屏换成卡片式。
       9 列网格最小宽度约 616px（固定列 544 + 间隙 72），再加上 #scroll 是 overflow-x:auto，
       内容一溢出就被裁掉 → 操作列（含「删」）实际不可点。
       实测漏网区是 vw∈[821,891]，所以断点取 960（vw>960 时内容区 ≥771px，留足余量）。
       这里改成竖排 + 指标带标签，保证删除按钮永远在屏幕内。 */
    .lib-hd{display:none}
    .lib-row{display:block;padding:12px}
    .lib-date{font-size:13px;margin-bottom:3px}
    .lib-host{margin-bottom:9px}
    .lib-m{display:inline-block;text-align:left;margin:0 16px 6px 0;font-size:12.5px}
    .lib-m::before{content:attr(data-l) " ";font-size:10px;color:var(--text-3);
      font-weight:400;font-variant-numeric:normal}
    .lib-sc{justify-content:flex-start;margin:2px 0 10px}
    .lib-sc::before{content:"健康分 ";font-size:10px;color:var(--text-3);margin-right:5px}
    .lib-act{justify-content:flex-start;gap:8px}
    .lib-act .mini{padding:7px 14px;font-size:12.5px;border-radius:6px}
  }

  /* ===== 裁决卡 ===== */
  .vcard{border-radius:var(--radius);border:1px solid;padding:15px 17px;margin-bottom:12px}
  .vcard .vk{font-size:10.5px;font-weight:600;letter-spacing:.5px;margin-bottom:5px;opacity:.85}
  .vcard .vh{font-size:16px;font-weight:600;letter-spacing:-.3px;line-height:1.45;margin-bottom:8px}
  .vcard .vr{font-size:12px;line-height:1.75}
  .vmeta{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding-top:9px;
    border-top:1px solid rgba(0,0,0,.07);font-size:11px;color:var(--text-2)}
  /* ===== 链路拆解 ===== */
  .chain{display:flex;align-items:stretch;overflow-x:auto;padding:2px 0 4px}
  .chain-i{flex:1;min-width:112px;padding:9px 11px;border-right:1px solid var(--border);border-radius:6px}
  .chain-i:last-child{border-right:none}
  .chain-i.broken{background:var(--red-bg)}
  .chain-i.weak{background:var(--amber-bg)}
  .chain-i.strong{background:var(--green-bg)}
  .chain-l{font-size:10.5px;color:var(--text-3);margin-bottom:5px;white-space:nowrap}
  .chain-v{font-size:17px;font-weight:600;letter-spacing:-.5px;line-height:1.15}
  .chain-b{font-size:10.5px;color:var(--text-3);margin-top:3px}
  .chain-g{font-size:10.5px;font-weight:600;margin-top:4px;white-space:nowrap}
  /* ===== 动作卡 ===== */
  .act{border:1px solid var(--border);border-left-width:3px;border-radius:var(--radius-sm);
    padding:11px 13px;margin-bottom:9px;background:var(--surface)}
  .act.p0{border-left-color:var(--red)}
  .act.p1{border-left-color:var(--amber)}
  .act.p2{border-left-color:var(--blue)}
  .act-h{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
  .act-do{font-size:12.5px;font-weight:600;line-height:1.5}
  .act-row{font-size:11.5px;color:var(--text-2);line-height:1.7;margin-top:5px}
  .act-row b{color:var(--text);font-weight:600}
  /* ===== 保存状态 ===== */
  .svdot{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 8px;
    border-radius:20px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:default}
  .svdot i{width:6px;height:6px;border-radius:50%;display:block;flex-shrink:0}
  .svdot.ok i{background:var(--green)}
  .svdot.bad{border-color:var(--red-line);background:var(--red-bg);color:var(--red)}
  .svdot.bad i{background:var(--red)}
  .svdot.warn{border-color:var(--amber-line);background:var(--amber-bg);color:var(--amber)}
  .svdot.warn i{background:var(--amber)}

<script>
/* ==================== 状态 ==================== */
/* 场次仓库：所有页面统一从这里读历史，不再用硬编码假数据 */
const STORE = createStore(createLocalBackend());

let ST = {
  view:'import',
  MODE:'paste',
  text:'',
  cat:'服饰',
  M:null, DIAG:null,
  curId:null,          // 当前诊断的场次 id（存入仓库后回填）
  todos:[],
  history:null,
  // 导入时填写的元信息
  hostName:'未命名主播',
  date:'',
  note:'',
  // 当前对比口径
  compareId:null,      // 场次对比选中的对比对象
  trendMetric:'gmv',
  trendRange:14,
  // 每个页面记住自己当前选中的维度板块（子页签）
  tab:{},
  // 导航历史栈：记录「这一步之前在看哪」。
  // 没有它，用户点进「看完整结论」就回不到本场数据了——只能靠侧栏重新点，
  // 而窄屏下侧栏是隐藏的，等于彻底困住。
  nav:[],
  // 程序化写过的 hash 队列：hashchange 里撞上它们，就说明是自己写的，
  // 不是用户按了后退键。（用布尔锁在连续快速跳转时会漏中间值）
  _hashQueue:[],
  // 决策结果缓存（key = 本场id + 对比场id），避免每次渲染重算
  _dec:null, _decKey:'',
  // 最近一次存档的回执（渲染在诊断页顶部）
  saveNote:null,
  // 删除采用「行内两阶段确认」：第一次点「删」进入待确认态，
  // 该行按钮当场变成「确认删除 / 取消」，第二次点才真删。
  // 不用原生 confirm 的原因：浏览器屏蔽对话框时（隐私模式、部分手机浏览器、
  // 勾过「阻止此页面创建更多对话框」）confirm 静默返回 false，
  // 表现就是「点了删除毫无反应」—— 这正是「删除按钮点不了」的一种成因。
  delPending:null,
  // 删除回执（渲染在场次库顶部），让操作有明确结果
  delNote:null,
};

/* ==================== 示例数据 ==================== */
const DEMO_TIME = `时间	在线人数	成交金额	讲解商品
19:00	820	0	开场暖场
19:10	1640	120	基础款T恤

20:00	2140	980	牛仔裤

20:50	2260	760	针织开衫
21:00	4120	3420	风衣
21:10	3860	3180	风衣
21:20	3520	2640	风衣

21:40	2640	1240	毛衣
21:50	2280	940	毛衣
22:00	1860	620	牛仔裤

22:30	980	260	福利款

const DEMO_SUM = `观看人数	9600
曝光人数	51500
平均在线	1800
峰值在线	4120
平均停留时长	41秒
GMV	¥86,420
成交订单数	654
退款率	18.6%
进入率	18.6%
商品点击率	23.0%
成交转化率	6.8%

const DEMO_PROD = `商品名称	商品点击率	成交转化率	销售额
基础款T恤	26.1%	8.4%	18240
针织开衫	21.4%	2.1%	7080
牛仔裤	28.8%	7.9%	16420
牛仔外套	31.2%	9.4%	14860
风衣	29.6%	8.1%	15680
毛衣	23.1%	5.2%	6240
福利款	34.2%	11.2%	7900`;

const DEMO_SRC = `流量来源	观看人数	进入率
自然推荐	4960	20.8%
关注粉丝	1900	24.1%
千川付费	2170	13.2%
搜索	615	26.4%
短视频引流	485	15.6%`;

/* 历史场次与主播：全部来自场次仓库，不再硬编码 */
/* 用法见 store.js —— STORE.all() / STORE.ordered() / STORE.byHost() / STORE.baseline() */

/* ==================== 路由 ==================== */
const VIEWS = {
  import: {title:'导入数据', meta:'粘贴后台数据即可，无需整理格式', ii:'↓', g:'录入'},
  library:{title:'场次库', meta:'你导入过的每一场都在这里，对比和趋势都基于它', ii:'▦', g:'录入'},
  report: {title:'单场诊断', meta:'', ii:'◉', g:'分析'},
  compare:{title:'场次对比', meta:'本场 vs 对比场 vs 历史均值', ii:'⇄', g:'分析'},
  host:   {title:'主播对比', meta:'同货盘下不同主播的效率差异', ii:'☺', g:'分析'},
  trend:  {title:'趋势看板', meta:'核心指标长期走势，看能力是否在提升', ii:'↗', g:'分析'},
  issues: {title:'问题库', meta:'跨场追踪反复出现的问题', ii:'☰', g:'管理'},
  action: {title:'行动清单', meta:'下场要改的事，可勾选跟踪', ii:'✓', g:'管理'},
};

/* ---------------------------------------------------------------
   维度板块（子页签）
   每个分析页拆成若干可点选的维度，一次只渲染一个板块，
   避免一路往下滚。badge 用于在页签上显示条目数。
-----------------------------------------------------------------*/
const SUBTABS = {
  report: [
    {k:'overview', t:'总览',       ii:'◉'},
    {k:'funnel',   t:'转化漏斗',   ii:'▽'},
    {k:'traffic',  t:'流量与时段', ii:'◫'},
    {k:'product',  t:'商品表现',   ii:'▦'},
    {k:'issues',   t:'问题诊断',   ii:'☰', badge:()=>ST.DIAG?ST.DIAG.issues.length:0, hot:true},
    {k:'action',   t:'行动清单',   ii:'✓', badge:()=>ST.todos.filter(t=>!t.done).length},
  ],
  compare: [
    {k:'verdict', t:'结论与决策', ii:'★', badge:()=>{ const d=cmpDecide(); return d?d.actions.length:0; }, hot:true},
    {k:'gap',    t:'差距概览', ii:'⇄'},
    {k:'detail', t:'指标明细', ii:'▤'},
    {k:'trend',  t:'走势对比', ii:'↗'},
  ],
  host: [
    {k:'rank',    t:'效率排行', ii:'①'},
    {k:'profile', t:'能力诊断', ii:'◔'},
  ],
  trend: [
    {k:'chart',   t:'走势图',   ii:'↗'},
    {k:'insight', t:'趋势解读', ii:'✎'},
    {k:'table',   t:'指标明细', ii:'▤'},
  ],
  issues: [
    {k:'track', t:'问题追踪', ii:'☰', badge:()=>chronicCount(), hot:true},
    {k:'plan',  t:'整改建议', ii:'✓'},
  ],
  action: [
    {k:'todo',  t:'待办清单',   ii:'☰'},
    {k:'owner', t:'分工与验证', ii:'☺'},
  ],
};
function chronicCount(){
  try{
    const t = STORE.issueTrends();
    return t.filter(x=>x.level==='chronic').length;
  }catch(e){ return 0; }
}
function tabsOf(v){ return SUBTABS[v] || []; }
/* 当前生效的子页签（无效值回落到第一个） */
function curTab(v){
  const list = tabsOf(v);
  if(!list.length) return null;
  const want = ST.tab[v];
  return list.some(x=>x.k===want) ? want : list[0].k;
}
/* 渲染页签条 */
function renderTabs(){
  const box = document.getElementById('tabs');
  if(!box) return;
  const list = tabsOf(ST.view);
  if(list.length < 2){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='';
  const cur = curTab(ST.view);
  box.innerHTML = list.map(x=>{
    let n = '';
    if(x.badge){
      let c = 0;
      try{ c = x.badge() || 0; }catch(e){ c = 0; }
      if(c) n = `<span class="tb-n${x.hot?' hot':''}">${c}</span>`;
    }
    return `<div class="tab${x.k===cur?' on':''}" onclick="setTab('${x.k}')">${
      x.ii?`<span style="font-size:10px;opacity:.65">${x.ii}</span>`:''}${x.t}${n}</div>`;
  }).join('');
}
/* 切换维度板块 */
function setTab(k){
  const prev = curTab(ST.view);
  if(prev !== k) navPush();      // 记住「切换前在看哪个板块」，返回键才有得回
  ST.tab[ST.view] = k;
  renderTabs();
  const S = document.getElementById('scroll');
  if(S) S.scrollTop = 0;
  renderView(ST.view);
  syncHash();
  renderBack();
}
/* 统一的分发入口：go() 与 setTab() 都走这里 */
function renderView(v){
  const fn = {import:renderImport, library:renderLibrary, report:renderReport,
    compare:renderCompare, host:renderHost, trend:renderTrend,
    issues:renderIssues, action:renderAction}[v];
  if(fn) fn();
  renderTabs();
}

/* ============================================================
   导航历史与返回键
   ------------------------------------------------------------
   为什么需要：从「单场诊断」点「看完整结论」跳到「场次对比·结论与决策」后，
   原本没有任何回到本场数据的入口——宽屏还能靠侧栏重新点，窄屏侧栏是
   display:none，用户就彻底出不来了。
   现在有两条退路：① 顶栏常驻「← 返回」；② 浏览器自己的后退键（hash 路由）。
   ============================================================ */
const ANALYZE_VIEWS = ['report','compare','host','trend','issues','action'];

/* 给一个历史条目起个人话名字，用于返回按钮上的提示：「单场诊断 · 转化漏斗」 */
function locLabel(e){
  if(!e) return '';
  const V = VIEWS[e.v] || {};
  const list = tabsOf(e.v);
  const t = list.length>1 ? ((list.filter(x=>x.k===e.k)[0]||{}).t || '') : '';
  const base = V.title || e.v;
  return t ? (base + ' · ' + t) : base;
}
/* 把「当前所在位置」压栈（记录的是出发点，不是目标） */
function navPush(){
  const cur = {v:ST.view, k:curTab(ST.view)};
  const top = ST.nav[ST.nav.length-1];
  if(top && top.v===cur.v && top.k===cur.k) return;   // 连续相同不重复压
  ST.nav.push(cur);
  if(ST.nav.length > 40) ST.nav.shift();              // 防止无限增长
}
/* 返回上一步。连续遇到与当前完全相同的位置就跳过，避免「按了没反应」。 */
function navBack(){
  while(ST.nav.length){
    const e = ST.nav.pop();
    const same = e.v===ST.view && (e.k||null)===(curTab(ST.view)||null);
    if(same) continue;
    go(e.v, {from:'back', k:e.k});
    return true;
  }
  renderBack();      // 栈空了就把返回键收起来
  return false;
}
/* 渲染顶栏返回键 */
function renderBack(){
  const box = document.getElementById('tbBack');
  if(!box) return;
  const e = ST.nav[ST.nav.length-1];
  if(!e){ box.innerHTML = ''; return; }
  const lb = locLabel(e);

/* ---- hash 路由：让浏览器自带的后退/前进键也能用 ---- */
function curHash(){
  const t = tabsOf(ST.view).length>1 ? curTab(ST.view) : '';
  return '#/' + ST.view + (t ? '/' + t : '');
}
function syncHash(){
  // 桩环境（Node 里跑测试）没有 location，直接跳过
  if(typeof location === 'undefined' || !location) return;
  try{
    const want = curHash();
    if(location.hash === want) return;
    ST._hashQueue.push(want);
    if(ST._hashQueue.length > 30) ST._hashQueue.shift();
    location.hash = want;
  }catch(e){ /* 沙箱限制写 hash，忽略即可，不影响站内返回键 */ }
}
function initHashRouter(){
  if(typeof window === 'undefined' || !window.addEventListener) return;
  window.addEventListener('hashchange', function(){
    let h = '';
    try{ h = String((typeof location!=='undefined' && location && location.hash) || ''); }catch(e){ return; }
    // 队列里命中 → 这是自己写进去的，跳过（连同它之前那些已被覆盖的中间值）
    const qi = ST._hashQueue.indexOf(h);
    if(qi >= 0){ ST._hashQueue.splice(0, qi+1); return; }
    const p = h.replace(/^#\/?/, '').split('/').filter(Boolean);
    const v = p[0];
    if(!v || !VIEWS[v]) return;
    const k = p[1] || undefined;
    if(v===ST.view && (k===undefined || k===curTab(ST.view))) return;
    // 浏览器自己回退了：把站内栈同步弹出，两套历史才不会打架
    const top = ST.nav[ST.nav.length-1];
    if(top && top.v===v && (k===undefined || top.k===k)) ST.nav.pop();
    go(v, {from:'back', k:k});
  });
}

function go(v, opt){
  opt = opt || {};
  // 分析类页面需先有数据；仓库类页面始终可进
  if(ANALYZE_VIEWS.includes(v) && !ST.M && !STORE.count()){
    v = 'import';
  }
  // 有历史但当前没载入诊断时，自动载入最新一场
  if(ANALYZE_VIEWS.includes(v) && !ST.M && STORE.count()){
    loadLatest();
  }
  // 普通跳转才记历史；返回/替换不入栈，否则返回键会来回弹
  const staying = v===ST.view && (!opt.k || opt.k===curTab(ST.view));
  if(!opt.from && !staying) navPush();
  if(opt.k) ST.tab[v] = opt.k;
  ST.delPending = null;   // 离开场次库就撤销「待确认」，避免状态残留
  ST.view = v;
  document.querySelectorAll('.nav-i').forEach(n=>n.classList.toggle('on', n.dataset.v===v));
  document.getElementById('tbTitle').textContent = VIEWS[v].title;
  document.getElementById('tbMeta').textContent = VIEWS[v].meta || '';
  renderTopbar();
  const S = document.getElementById('scroll');
  if(S) S.scrollTop = 0;
  renderView(v);
  syncHash();
  renderBack();
  closeViewMenu();
}

/* 载入仓库里最新一场作为当前诊断 */
function loadLatest(){
  const latest = STORE.all()[0];
  if(!latest) return false;
  // 用原始文本重解析，保证与引擎版本一致
  if(latest.raw){
    const blocks = splitBlocks(latest.raw);
    let recs=[], unk=[];
    blocks.forEach(b=>{
      const p = parseTable(parseDelimited(b));
      recs = recs.concat(p.records); unk = unk.concat(p.unknown||[]);
    });
    const M = normalize(recs, {category:latest.category});
    M.unknownFields = [...new Set(unk)].filter(Boolean);
    ST.M = M;
    ST.DIAG = runDiagnosis(M);
    ST.history = STORE.issueTrends();
  } else {
    ST.M = null; ST.DIAG = null;
  }
  ST.curId = latest.id;
  rebuildTodos();   // 必须放在 curId 之后：勾选状态是按「场次 id + 待办文本」查的
  ST.cat = latest.category;
  ST.hostName = latest.hostName;
  ST.date = latest.date;
  ST.note = latest.note;
  ST.saveNote = null;
  updateBadges();
  return true;
}

/* 保存状态徽标：把「存没存住」这件事从隐性变成显性。
   过去后端失败是静默的，用户第二天才发现数据没了——现在失败会红着显示。 */
function saveBadge(){
  let st;
  try{ st = STORE.saveState(); }catch(e){ return ''; }
  const n = STORE.count();
  if(st.ok === null && !n){
    return `<span class="svdot" title="还没有录入任何数据"><i style="background:var(--text-3)"></i>未录入</span>`;
  }
  if(!st.ok){
    return `<span class="svdot bad" style="cursor:pointer" onclick="backupGuide()"
      title="${esc(st.error||'保存失败')}"><i></i>未存住 · 点此备份</span>`;
  }
  return `<span class="svdot ok" title="已写入本机浏览器存储，关掉网页也不会丢"><i></i>已存本机 ${n} 场</span>`;
}

/* 导入前就做环境自检：如果这个浏览器根本存不住数据，提前讲清楚，
   而不是等用户录了一周、第二天打开发现全没了。 */
function envWarn(){
  let hp;
  try{ hp = STORE.health(); }catch(e){ return ''; }
  if(hp.level !== 'bad') return '';
  const has = hp.count > 0;
  const btn = has
    ? `<div style="margin-top:8px"><button class="btn sm" onclick="exportLib()">立即导出已录入的 ${hp.count} 场</button></div>`
    : '';
  return `<div class="note" style="background:var(--red-bg);border:1px solid var(--red-line);
    color:var(--red);margin-bottom:12px;line-height:1.8">
    <b>⚠ 这个浏览器存不住数据</b><br>
    原因：${esc(hp.error || '浏览器拒绝了本地存储')}<br>
    也就是说，现在录入的数据在关掉网页后会丢失。常见于：无痕/隐私模式、浏览器禁用了站点数据、存储空间已满。<br>
    <b>怎么解决</b>：换用 Chrome 或 Edge 的<b>正常窗口</b>打开本页（不要用无痕模式）；
    如果必须在这个环境用，每次录完点「导出备份」存成文件，下次用「导入备份」恢复。
    ${btn}
  </div>`;
}

/* 保存失败时的引导：先把内存里的数据导出来，别等它丢 */
function backupGuide(){
  const st = STORE.saveState();
  const n = STORE.count();
  const reason = st.error || '浏览器拒绝了本次存储（可能是隐私模式、禁用了站点数据，或存储已满）';
  const msg = '数据没能写进本机存储。\n\n原因：' + reason + '\n\n'
    + '当前内存里已有 ' + n + ' 场记录，但关掉网页就会丢。\n\n'
    + '点「确定」立即导出成 JSON 文件保存到本地，之后可以再导回来。';
  if(confirm(msg)){
    try{ exportLib(); }catch(e){ alert('导出失败：'+e.message); }
  }
}

/* 载入示例历史：一次性生成 6 场，让对比/趋势/问题库立刻有内容 */
function seedDemoHistory(){
  if(STORE.count() && !confirm('将在现有 '+STORE.count()+' 场基础上再添加 6 场示例数据，继续？')) return;
  const hosts = ['小雨','小雨','小满','阿静','小雨','小满'];

    const d = new Date(now.getTime() - i*86400000);

  const scenes = [
    {views:9800,  stay:52, gmv:88000,  entry:19.2, cvr:8.2, refund:7.4, paid:32},
    {views:10400, stay:58, gmv:104000, entry:20.4, cvr:9.1, refund:6.2, paid:30},
    {views:9600,  stay:41, gmv:86420,  entry:19.4, cvr:6.8, refund:18.6,paid:34}, // 掉链子的一场
    {views:11200, stay:61, gmv:118000, entry:21.0, cvr:9.8, refund:6.0, paid:28},
    {views:10600, stay:56, gmv:96000,  entry:19.8, cvr:8.6, refund:7.0, paid:31},
    {views:11800, stay:64, gmv:132000, entry:21.6,cvr:10.3,refund:5.6, paid:27},
  ];
  let added=0;
  scenes.forEach((c,i)=>{

      cvr:c.cvr, refundRate:c.refund, paidRate:c.paid,

    const r = STORE.add({
      M, DIAG,
      raw:`观看人数\t${c.views}\n平均停留时长\t${c.stay}秒\nGMV\t${c.gmv}\n曝光进入率\t${c.entry}%\n成交转化率\t${c.cvr}%\n退款率\t${c.refund}%\n付费流量占比\t${c.paid}%`,
      category:'服饰', hostName:hosts[i], date:days[i], note:notes[i],

  });
  updateBadges();
  alert('已添加 '+added+' 场示例历史，现在可以看场次对比、趋势看板、问题库了。');
  go('library');
}

/* ==================== 分析主流程 ==================== */
function analyze(){
  const t = (ST.text||'').trim();
  if(!t){ alert('请先粘贴数据，或点「载入示例数据」'); return; }
  ST.cat = document.getElementById('cat') ? document.getElementById('cat').value : ST.cat;

  const blocks = splitBlocks(t);
  let recs=[], unk=[];
  blocks.forEach(b=>{
    const p = parseTable(parseDelimited(b));
    recs = recs.concat(p.records); unk = unk.concat(p.unknown||[]);
  });
  const M = normalize(recs, {category:ST.cat});
  M.unknownFields = [...new Set(unk)].filter(Boolean);
  const DIAG = runDiagnosis(M);
  ST.M = M; ST.DIAG = DIAG;
  // 待办等本场 id 落地后再重建（见下方 rebuildTodos）——
  // 勾选状态是按「场次 id + 待办文本」存的，id 还没确定就重建会串到别的场次去

  // ---- 存档：把这一场写进仓库 ----
  const meta = readImportMeta();
  const res = STORE.add({
    M, DIAG,
    raw: t,
    category: ST.cat,
    hostName: meta.hostName,
    date: meta.date,
    note: meta.note,
  });
  ST.curId = res.record.id;
  rebuildTodos();     // 本场 id 已确定，按它恢复勾选状态与手动加入的动作
  ST.history = STORE.issueTrends();

  // 存档回执：明确告诉用户「这一场记下来了没有、记成第几场」
  // 过去这里没有反馈，用户不知道数据到底存没存住 —— 这是「昨天数据没了」的直接来源
  // 重复导入时会切到「已存在的那一场」，所以回执必须说清切到哪一场，
  // 否则用户会以为「我刚导入的数据怎么变成旧场次的结论了」。
  ST.saveNote = res.dup
    ? {k:'dup', txt:'这份数据和已存的第 '+(res.record.seq||'?')+' 场（'+res.record.date
        +' · '+res.record.hostName+'）完全一致，没有重复记录（避免同一天录两遍把均值拉偏）。'
        +'已切到那一场，下面的对比和结论都是按它算的。'}
    : (res.saved
        ? {k:'ok', txt:'已记录为第 ' + STORE.count() + ' 场（' + res.record.date + ' · ' + res.record.hostName + '）。下次导入会自动和这一场对比。'}
        : {k:'bad', txt:'已记到内存，但没能写进本机存储——关掉网页会丢。请立即导出备份。'});
  updateBadges();

  ST.tab.report = 'overview';
  go('report');
}

/* 读导入页填写的元信息 */
function readImportMeta(){
  const g = id => { const el = document.getElementById(id); return el ? (el.value||'').trim() : ''; };
  const date = g('impDate') || (STORE.count() ? '' : '');
  return {
    hostName: g('impHost') || '未命名主播',
    date: date || todayStr(),
    note: g('impNote'),
  };
}
function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function splitBlocks(text){
  const raw = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const out = [];
  raw.split(/\n\s*\n+/).forEach(p=>{
    const c = p.split('\n').filter(l=>!/^\s*【.*】\s*$/.test(l)).join('\n');
    if(c.trim()) out.push(c);
  });
  return out;
}

/* ==================== 单场诊断（按维度分板块） ==================== */
/* 一次只渲染当前选中的维度板块，避免一条长页滚到底 */
function renderReport(){
  const M = ST.M, D = ST.DIAG, s = M.session;
  if(!Object.keys(s).length){
    document.getElementById('scroll').innerHTML =
      `<div class="warn"><b>没有识别到有效数据。</b>请确认粘贴内容包含表头行（如「观看人数」「GMV」），且数值在表头下一行或右侧。</div>`;
    return;
  }
  const tab = curTab('report');
  let h = repMissWarn(M);
  let after = null;

  if(tab==='overview')      h += repOverview(M, D, s);
  else if(tab==='funnel')   h += repFunnel(M, D, s);
  else if(tab==='traffic'){ h += repTraffic(M, D, s); if(M.flags.hasTimeline) after = () => drawChart(M); }
  else if(tab==='product')  h += repProduct(M, D, s);
  else if(tab==='issues')   h += repIssues(D);
  else if(tab==='action')   h += repActionSec();

  document.getElementById('scroll').innerHTML = h;
  if(after) requestAnimationFrame(after);
}

/* 缺失字段提示：各板块顶部共用 */
function repMissWarn(M){
  const miss = ['views','avgStay','gmv','entryRate','cvr'].filter(k=>M.flags[k]);
  const missName = {views:'观看人数',avgStay:'平均停留',gmv:'GMV',entryRate:'进入率',cvr:'成交转化率'};
  if(!miss.length && !M.unknownFields.length) return '';
  return `<div class="warn">${miss.length?`<b>缺少字段</b>：${miss.map(k=>missName[k]).join('、')}，对应分析已跳过。`:''}
    ${M.unknownFields.length?`<br><b>未能识别</b>：${M.unknownFields.slice(0,10).join('、')}。`:''}
    ${M.flags.hasTimeline?'':'<br><b>无分时段数据</b>：已跳过时段热力、拐点定位与排期建议。'}</div>`;
}

/* ---------- 板块 1：总览 ---------- */

            <div class="dmeta">
              <span class="badge ${it.sev==='high'?'b-red':it.sev==='mid'?'b-amber':'b-blue'}">${it.sev==='high'?'P0':it.sev==='mid'?'P1':'P2'}</span>
              <span>${it.meta}</span>

  h += `<div class="card"><div class="ch"><div class="ct">关键指标 <span class="tagline">vs 类目基准</span></div></div>
    <div class="tb-wrap"><table><tbody>`;

/* 总览页的 5 个维度入口卡 */
function repDimNav(M, D, s){
  const A = D.analyses.A, PQ = D.analyses.PQ, SRC = D.analyses.SRC, RF = D.analyses.RF;
  const B = benchOf(ST.cat);
  const cards = [];

  /* 转化漏斗 */
  const cvrGap = (s.cvr!=null && B.cvr) ? (s.cvr-B.cvr) : null;
  cards.push(dimCard('funnel','转化漏斗','▽',[
    ['进入率', s.entryRate!=null?s.entryRate+'%':'—', s.entryRate!=null&&B.entryRate&&s.entryRate<B.entryRate?'var(--red)':null],
    ['成交转化率', s.cvr!=null?s.cvr+'%':'—', cvrGap!=null&&cvrGap<0?'var(--red)':'var(--green)'],
    ['UV 价值', s.uvValue!=null?'¥'+s.uvValue:'—', s.uvValue!=null&&B.uvValue&&s.uvValue<B.uvValue?'var(--red)':null],
  ]));

  /* 流量与时段 */
  const peak = (A && A.slots.length) ? Math.max(...A.slots.map(x=>x.online||0)) : (s.peakOnline||null);
  const topSrc = SRC && SRC.list.length ? SRC.list[0] : null;
  cards.push(dimCard('traffic','流量与时段','◫',[
    ['峰值在线', peak!=null?peak.toLocaleString():'—'],
    ['主要来源', topSrc?topSrc.name+' '+topSrc.share.toFixed(0)+'%':'—'],
    ['低效时段', (A&&A.wasted)?A.wasted.length+' 个':'—', (A&&A.wasted&&A.wasted.length)?'var(--red)':null],
  ]));

  /* 商品表现 */
  const hi = PQ ? PQ.list.filter(p=>p.quadrant==='highTime').length : 0;
  const low = PQ ? PQ.list.filter(p=>p.quadrant==='lowTime').length : 0;
  cards.push(dimCard('product','商品表现','▦',[
    ['上架商品', M.products.length?M.products.length+' 款':(PQ?PQ.list.length+' 款':'—')],
    ['高效商品', hi+' 款', hi?'var(--green)':null],
    ['待压缩商品', low+' 款', low?'var(--red)':null],
  ]));

  /* 问题诊断 */
  const p0 = D.issues.filter(i=>i.sev==='high').length;
  const p1 = D.issues.filter(i=>i.sev==='mid').length;
  cards.push(dimCard('issues','问题诊断','☰',[
    ['问题总数', D.issues.length+' 项'],
    ['P0 严重', p0+' 项', p0?'var(--red)':null],
    ['P1 关注', p1+' 项', p1?'var(--amber)':null],
  ]));

  /* 行动清单 */
  const un = ST.todos.filter(t=>!t.done).length;
  cards.push(dimCard('action','行动清单','✓',[
    ['待办事项', ST.todos.length+' 项'],
    ['未完成', un+' 项', un?'var(--amber)':null],
    ['责任人', new Set(ST.todos.map(t=>t.owner)).size+' 个'],
  ]));

  /* 退款归因 */
  if(RF){
    cards.push(dimCard('overview','退款归因','◈',[
      ['本场退款率', RF.rate+'%', RF.rate>RF.bench?'var(--red)':'var(--green)'],
      ['类目基准', RF.bench+'%'],
      ['损失 GMV', RF.lostGmv!=null?'¥'+RF.lostGmv.toLocaleString():'—'],
    ]));
  }

  return `<div class="dims">${cards.join('')}</div>`;
}

/* ---------- 板块 2：转化漏斗 ---------- */
function repFunnel(M, D, s){
  const B = benchOf(ST.cat);
  let h = `<div class="grid g21">
    <div class="card">
      <div class="ch"><div class="ct">转化漏斗 <span class="tagline">标出断点环节</span></div>
        <div class="cs">数值为该环节规模</div></div>
      ${renderFunnelHTML(M, D, B)}
    </div>
    <div class="card">
      <div class="ct mb8">GMV 三因子拆解</div>
      ${repGmvFactors(M, s, B)}
    </div>
  </div>`;

  /* 漏斗全环节明细 */
  const steps = repFunnelSteps(M, s, B);
  if(steps.length){
    h += `<div class="card mt12">
      <div class="ch"><div class="ct">各环节 vs 基准</div>
        <div class="cs">差距 = 本场 − 基准（pp 为百分点）</div></div>
      <div class="tb-wrap"><table><thead><tr>
        <th>环节</th><th class="num">本场</th><th class="num">类目基准</th><th style="text-align:right">差距</th>
      </tr></thead><tbody>
      ${steps.map(([n,v,b,unit])=>{
        let gap='';
        if(v!=null && b!=null){
          const d = v-b;
          const good = d>0;
          gap = `<span class="${Math.abs(d)<0.3?'flat':(good?'down':'up')}">${d>0?'▲':'▼'}${Math.abs(d).toFixed(1)}${unit==='pp'?'pp':''}</span>`;
        } else gap = '<span class="flat">—</span>';
        return `<tr><td>${n}</td>
          <td class="num" style="font-weight:600">${v==null?'—':(unit==='pp'?v+'%':v)}</td>
          <td class="num" style="color:var(--text-3)">${b==null?'—':(unit==='pp'?b+'%':b)}</td>
          <td style="text-align:right">${gap}</td></tr>`;
      }).join('')}
      </tbody></table></div>
    </div>`;
  }
  return h;
}

/* GMV 三因子：曝光 × 进入率 × 转化率 × 客单价 */
function repGmvFactors(M, s, B){
  const rows = [
    ['曝光人数', s.exposure, null, v=>v.toLocaleString()],
    ['进入率', s.entryRate, B.entryRate, v=>v+'%'],
    ['成交转化率', s.cvr, B.cvr, v=>v+'%'],
    ['客单价', s.aov, B.aov, v=>'¥'+v],
  ].filter(r=>r[1]!=null);

  if(rows.length<2) return '<div class="empty">数据不足</div>';

  let worst = null, worstGap = 0;
  rows.forEach(([n,v,b])=>{
    if(b==null||!b) return;
    const g = (v-b)/b*100;
    if(g<worstGap){ worstGap=g; worst=n; }
  });

  const advice = {
    '进入率':'进入率低说明封面/标题或投放人群不匹配，先别急着改货——人根本没进来。',
    '成交转化率':'转化率低是话术、价格锚点或排品顺序的问题，属于「人」的可控项。',
    '客单价':'客单价低通常是只推了低价款，缺少中高价位的价值塑造与搭配推荐。',
    '曝光人数':'曝光不足是流量问题，需要加大投放或优化短视频引流。',
  }[worst];

  return `<div style="font-size:11.5px">
    <div class="note" style="font-size:11px;padding:8px 10px;margin-bottom:10px">
      GMV ≈ 曝光人数 × 进入率 × 成交转化率 × 客单价。逐个因子对基准，就能定位是「流量问题」还是「承接问题」。
    </div>
    ${rows.map(([n,v,b,fmt])=>{
      const g = (b&&b!==0) ? (v-b)/b*100 : null;
      const bad = g!=null && g<-10;
      return `<div style="display:flex;justify-content:space-between;align-items:baseline;
        padding:5px 0;border-bottom:1px dashed var(--border)">
        <span style="color:var(--text-3)">${n}</span>
        <span><b style="font-weight:600;font-variant-numeric:tabular-nums">${fmt(v)}</b>
        ${g!=null?`<span class="${Math.abs(g)<5?'flat':(g>0?'down':'up')}" style="font-size:10.5px;margin-left:6px">
          ${g>0?'▲':'▼'}${Math.abs(g).toFixed(0)}%</span>`:''}</span>
      </div>`;
    }).join('')}
    ${worst?`<div class="note mt12" style="font-size:11px">
      <b>最大拖累项：${worst}</b>（低于基准 ${Math.abs(worstGap).toFixed(0)}%）。<br>${advice}
    </div>`:`<div class="note mt12" style="font-size:11px">各因子均达标或缺少基准可比。</div>`}
  </div>`;
}

/* 漏斗各环节数值（用于对照表） */
function repFunnelSteps(M, s, B){
  const out = [];
  if(s.entryRate!=null) out.push(['进入率', s.entryRate, B.entryRate||null, 'pp']);
  if(s.cvr!=null)       out.push(['成交转化率', s.cvr, B.cvr||null, 'pp']);
  if(s.aov!=null)       out.push(['客单价', s.aov, B.aov||null, '']);
  if(s.uvValue!=null)   out.push(['UV 价值', s.uvValue, B.uvValue||null, '']);
  if(s.naturalRate!=null) out.push(['自然流量占比', s.naturalRate, B.naturalRate||null, 'pp']);
  return out;
}

/* ---------- 板块 3：流量与时段 ---------- */
function repTraffic(M, D, s){
  const A = D.analyses.A, SRC = D.analyses.SRC;
  const B = benchOf(ST.cat);
  let h = '';

  /* 流量来源 + 结构解读 */
  h += `<div class="grid g21">
    <div class="card">
      <div class="ch"><div class="ct">流量来源 <span class="tagline">占比 vs 进入率</span></div>
        <div class="cs">${SRC?SRC.list.length+' 个渠道':'—'}</div></div>
      ${SRC ? renderSourceTable(SRC) : '<div class="empty">无流量来源数据<br><span style="font-size:11px">补充「渠道名 + 人数 + 进入率」后可生成</span></div>'}
    </div>
    <div class="card">
      <div class="ct mb8">流量结构解读</div>
      ${repSourceInsight(M, s, SRC, B)}
    </div>
  </div>`;

  /* 时段热力 */
  if(M.flags.hasTimeline && A){
    h += `<div class="card mt12">
      <div class="ch">
        <div class="ct">时段热力 <span class="tagline">柱高=在线人数 · 颜色=成交效率</span></div>
        <div class="cs">效率系数 = 成交占比 ÷ 流量占比</div>
      </div>
      ${renderHeat(A)}
      <div class="row mt12" style="gap:16px">
        <span class="muted"><span style="display:inline-block;width:9px;height:9px;background:var(--green);border-radius:2px;vertical-align:-1px"></span> 高效 系数&gt;1.5</span>
        <span class="muted"><span style="display:inline-block;width:9px;height:9px;background:var(--amber);border-radius:2px;vertical-align:-1px"></span> 一般 0.6–1.5</span>
        <span class="muted"><span style="display:inline-block;width:9px;height:9px;background:var(--red);border-radius:2px;vertical-align:-1px"></span> 低效 系数&lt;0.6</span>
      </div>
    </div>`;

    /* 高效 / 低效时段排名 */
    h += `<div class="grid g2 mt12">
      <div class="card">
        <div class="ch"><div class="ct">最高效时段 <span class="tagline">加预算</span></div></div>
        ${repSlotRank(A, 'best')}
      </div>
      <div class="card">
        <div class="ch"><div class="ct">最低效时段 <span class="tagline">压缩或换品</span></div></div>
        ${repSlotRank(A, 'worst')}
      </div>
    </div>`;

    /* 走势折线 */
    h += `<div class="card mt12">
      <div class="ch"><div class="ct">流量与成交走势 <span class="tagline">自动标注拐点</span></div></div>
      <div class="lg">
        <span><i style="background:#21578E"></i>在线人数</span>
        <span><i style="background:#C0392B"></i>成交金额</span>
      </div>
      <div class="chart"><canvas id="cv"></canvas></div>
    </div>`;
  } else {
    h += `<div class="warn mt12"><b>没有分时段数据</b>：时段热力、时段效率排名与拐点定位都需要按时间排列的明细（如「时间 + 在线人数 + 成交金额」）。</div>`;
  }

  return h;
}

/* 流量结构解读 */
function repSourceInsight(M, s, SRC, B){
  if(!SRC) return '<div class="empty">无流量来源数据</div>';
  const paid = SRC.paid, natural = SRC.natural;
  const other = Math.max(0, 100-paid-natural);
  const risky = paid > 45;
  const rows = [
    ['付费流量', paid.toFixed(1)+'%', risky?'var(--red)':'var(--text)'],
    ['自然/推荐', natural.toFixed(1)+'%', natural<30?'var(--amber)':'var(--green)'],

  ];
  return `<div style="font-size:11.5px">

function repProductPlan(PQ){
  const g = k => PQ.list.filter(p=>p.quadrant===k);

  const hidden = g('highShortTime'); // 讲得少 + 转化高
  const burn = g('lowTime');       // 讲得多 + 转化低
  const weak = g('lowShortTime');  // 讲得少 + 转化低

  const block = (title, list, color, action) => {
    if(!list.length) return '';
    return `<div style="margin-bottom:11px">
      <div style="font-size:11.5px;font-weight:600;color:${color};margin-bottom:3px">
        ${title} <span class="muted" style="font-weight:400">${list.length} 款</span></div>

        <span style="color:var(--text-3)">${action}</span></div>
    </div>`;
  };

  let h = '';
  h += block('明星品 · 加大', star, 'var(--green)', '讲解频次与投放预算都可以再加，这是本场的主要产出品。');
  h += block('被埋没 · 增加曝光', hidden, 'var(--blue)', '转化高但只讲了几段——下场把它安排到流量高位时段，加大讲解次数。');
  h += block('拖后腿 · 压缩', burn, 'var(--red)', '占用了最多讲解时间但转化最差，直接砍到 1–2 段，把时间让给明星品。');
  h += block('低效 · 换品', weak, 'var(--amber)', '讲得少也卖不动，考虑替换或改价，不要再占排期。');

  return h;
}

/* ---- KPI ---- */
function kpi(label, val, raw, base, ramp, inverse){
  let d = '';
  if(raw!=null && base!=null){
    const gap = (raw-base)/base*100;
    const good = inverse ? gap<0 : gap>0;
    const cls = Math.abs(gap)<3 ? 'flat' : (good?'down':'up');
    d = `<span class="${cls}">${gap>0?'▲':'▼'}${Math.abs(gap).toFixed(1)}%</span>
         <span class="muted">基准 ${base}${label.includes('率')||label.includes('占比')?'%':''}</span>`;
  } else if(raw!=null){
    d = `<span class="muted">基准 ${base==null?'—':base}</span>`;
  } else {
    d = `<span class="muted">未提供</span>`;
  }
  const barColor = {red:'var(--red)',blue:'var(--blue)',amber:'var(--amber)',purple:'var(--purple)'}[ramp];
  let w = 100;
  if(raw!=null && base!=null){
    w = Math.min(100, Math.max(8, inverse ? (base/raw*50) : (raw/base*50)));
  }
  return `<div class="kpi">
    <div class="kpi-l">${label}</div>
    <div class="kpi-v">${val}</div>
    <div class="kpi-d">${d}</div>
    <div class="kpi-bar"><i style="width:${w}%;background:${barColor}"></i></div>
  </div>`;
}
function fmt(v){ return v==null?'—':(typeof v==='number'?v.toLocaleString():v); }
function shortNum(it){
  const e = it.evidence && it.evidence[0];
  if(!e) return '';
  return String(e[1]).split('（')[0];
}

/* ---- 健康分环 ---- */
function scoreRing(score){
  const r=40, c=2*Math.PI*r;
  const pct = Math.max(0, Math.min(100, score))/100;
  const col = score>=85?'#276B4E':score>=70?'#21578E':score>=55?'#A8701A':'#C0392B';
  return `<div class="score-hero">
    <div class="ring">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="${r}" fill="none" stroke="#EDEDE9" stroke-width="8"/>
        <circle cx="48" cy="48" r="${r}" fill="none" stroke="${col}" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}"
          transform="rotate(-90 48 48)"/>
      </svg>
      <div class="ring-num"><b style="color:${col}">${score}</b><span>/ 100</span></div>
    </div>
    <div style="font-size:11.5px;color:var(--text-2);line-height:1.7">
      <div>评分基于 <b>${ST.DIAG.issues.length}</b> 项检出问题加权扣分</div>

      <div class="muted">范围 28–96，不追求满分</div>
    </div>
  </div>`;
}

/* ---- 漏斗 ---- */
function renderFunnelHTML(M, D, B){
  const s = M.session;
  const steps = [];
  if(s.exposure!=null) steps.push({n:'曝光',v:s.exposure,r:null,b:null,c:'#C9D6E5'});
  if(s.views!=null){
    const r = s.exposure ? s.views/s.exposure*100 : (s.entryRate!=null?s.entryRate:null);
    steps.push({n:'进入直播间',v:s.views,r:r!=null?+r.toFixed(1):null,b:B.entryRate,c:'#9DB8D4'});
  }
  if(s.orders!=null) steps.push({n:'下单支付',v:s.orders,r:s.cvr!=null?s.cvr:null,b:B.cvr,c:'#6A8FB5'});
  if(s.buyers!=null && s.orders && s.buyers!==s.orders)
    steps.push({n:'成交人数',v:s.buyers,r:null,b:null,c:'#4A6E94'});
  if(steps.length<2) return '<div class="empty">数据不足，无法绘制漏斗</div>';

  let wi=-1, wg=0;
  steps.forEach((st,i)=>{
    if(st.r!=null && st.b){
      const g=(st.r-st.b)/st.b;
      if(g<wg){ wg=g; wi=i; }
    }
  });
  const max = steps[0].v;
  let h = '<div class="fun">';
  steps.forEach((st,i)=>{
    const w = Math.max(st.v/max*100,3);
    const bk = i===wi;
    let rc = '<span style="color:var(--text-3)">—</span>';
    if(st.r!=null){
      if(st.b){
        const d=st.r-st.b;
        rc=`<span class="${d<-3?'up':d>3?'down':'flat'}">${st.r}% (${d>0?'+':''}${d.toFixed(1)}pp)</span>`;
      } else rc=`<span>${st.r}%</span>`;
    }
    h += `<div class="fs ${bk?'break':''}">
      <div class="fsn">${st.n}${bk?'<span class="btag">断点</span>':''}</div>
      <div class="fsw"><div class="fsb" style="width:${w}%;background:${st.c}"></div></div>
      <div class="fsv">${st.v.toLocaleString()}</div>
      <div class="fsr">${rc}</div></div>`;
  });
  h += '</div>';
  if(wi>0){
    h += `<div class="note mt12" style="font-size:11px">
      <b>断点</b>：${steps[wi].n} 转化 ${steps[wi].r}%，基准 ${steps[wi].b}%。
      上游漏水时优化下游等于白费，优先修这一环。</div>`;
  }
  return h;
}

/* ---- 时段热力 ---- */
function renderHeat(A){
  const slots = A.slots;
  const maxOn = Math.max(...slots.map(s=>s.online||0), 1);
  const effs = slots.map(s=>s.efficiency).filter(e=>e>0);
  const maxE = effs.length ? Math.max(...effs) : 1;
  let h = '<div class="heat">';
  slots.forEach(s=>{
    const hpct = (s.online||0)/maxOn;
    const e = s.efficiency;
    let col = 'var(--surface-3)';
    if(e>0){
      if(e>1.5) col='var(--green)';
      else if(e>=0.6) col='var(--amber)';
      else col='var(--red)';
    }
    h += `<div class="hbar" style="height:${Math.max(hpct*100,4)}%;background:${col}"
      title="${s.label}｜在线 ${s.online||0}｜成交 ¥${s.gmv||0}｜效率 ${e.toFixed(2)}${s.item?'｜'+s.item:''}"></div>`;
  });
  h += '</div><div class="heat-x">';
  const step = Math.max(1, Math.ceil(slots.length/8));
  slots.forEach((s,i)=>{ h += `<span>${i%step===0?s.label:''}</span>`; });
  h += '</div>';
  return h;
}

  });

/* ---- 待办 --------
   待办有两个来源，必须分清：
   ① 派生项：由「单场诊断」命中的问题 × 每条问题的建议动作自动生成。
      所以一场数据如果所有规则都没命中，派生项就是 0 条 —— 这是好消息，不是功能坏了。
   ② 手动项：在「场次对比 → 结论与决策」点「加入行动清单」加进来的决策动作。
   勾选状态与手动项都要落盘：以前它们只活在内存里，刷新页面或切一场再回来就全没了。 */
const TODO_KEY = 'fupantai.todos.v1';

function tdBlank(){ return {ver:1, done:{}, manual:{}}; }
function tdLoad(){
  try{
    const raw = localStorage.getItem(TODO_KEY);
    const o = raw ? JSON.parse(raw) : null;
    if(!o || typeof o!=='object') return tdBlank();
    o.done = o.done||{}; o.manual = o.manual||{};
    return o;
  }catch(e){ return tdBlank(); }
}
function tdSave(o){
  try{ localStorage.setItem(TODO_KEY, JSON.stringify(o)); ST.todoStoreOK = true; return true; }
  catch(e){ ST.todoStoreOK = false; return false; }   // 隐私模式 / 配额满：本次会话仍可用，只是不留存
}
function tdKeyOf(sid, text){ return String(sid||'_') + '|' + String(text); }
/* 删除场次时把它的待办记录一并清掉，否则本机存储会越积越脏 */
function tdForget(sid){
  const o = tdLoad();
  const pre = String(sid||'_') + '|';
  Object.keys(o.done).forEach(k=>{ if(k.indexOf(pre)===0) delete o.done[k]; });
  delete o.manual[String(sid||'_')];
  tdSave(o);
}

/* 重建当前场次的待办列表：派生项 + 手动项 + 各自的勾选状态。
   原来所有 `ST.todos = issuesToTodos(...)` 的地方都改调它 ——
   直接赋值会让勾选和手动项在每次「载入场次」时被冲掉。 */
function rebuildTodos(){
  const sid = ST.curId || '_';
  const st = tdLoad();
  const derived = ST.DIAG ? issuesToTodos(ST.DIAG.issues) : [];
  derived.forEach(t=>{
    t.done = !!st.done[tdKeyOf(sid, t.t)];
    t.manual = false;
  });
  const manual = (st.manual[sid]||[]).map(t=>({
    t: t.t, p: t.p||'P2', owner: t.owner||'运营', from: t.from||'决策动作',
    why: t.why, target: t.target, how: t.how, done: !!t.done, manual: true,
  }));
  // P0 → P1 → P2；同优先级里未完成的排在前面
  const rank = {P0:0, P1:1, P2:2};
  ST.todos = derived.concat(manual).sort((a,b)=>
    ((rank[a.p]!=null?rank[a.p]:9) - (rank[b.p]!=null?rank[b.p]:9)) || ((a.done?1:0) - (b.done?1:0)));
  return ST.todos;
}

/* 当前场次的人话标签：「（2026-09-17 · 小 B）」；取不到就返回空串。
   优先用场次记录里的值 —— ST.date / ST.hostName 在部分路径下还是空的。 */
function tdCurLabel(){
  let rec = null;
  try{ rec = (typeof STORE!=='undefined' && STORE && ST.curId) ? STORE.get(ST.curId) : null; }catch(e){ rec = null; }
  const d = (rec && rec.date) || ST.date || '';
  const h2 = (rec && rec.hostName) || ST.hostName || '';
  const parts = [d, h2].filter(Boolean);
  return parts.length ? ('（' + parts.join(' · ') + '）') : '';
}

/* 待办为空时必须说清「为什么空、怎么才会有」——
   以前只写一句「无待办项」，用户完全分不清是自己没录数据、这一场确实没问题、还是功能坏了。 */
function todoEmptyHint(){
  let n = 0;
  try{ n = (typeof STORE!=='undefined' && STORE && STORE.count) ? STORE.count() : (ST.M?1:0); }
  catch(e){ n = ST.M?1:0; }
  if(!n){
    return `<div class="empty">
      <div style="font-weight:600;margin-bottom:6px">还没有待办 —— 一场数据都还没录</div>
      <div style="line-height:1.7">行动项不是手写的，是<b>诊断自动生成</b>的：<br>
        录入一场直播数据 → 引擎把每个指标跟基准逐条比对 → 命中的问题会拆成具体动作落到这里。</div>
      <div style="margin-top:11px"><button class="btn sm" onclick="go('import')">去录入第一场</button></div>
    </div>`;
  }
  if(ST.DIAG && (!ST.DIAG.issues || !ST.DIAG.issues.length)){
    return `<div class="empty">
      <div style="font-weight:600;margin-bottom:6px">这一场没有产生待办 —— 诊断没命中任何问题</div>
            <div style="line-height:1.7">本场${esc(tdCurLabel())}的指标都落在基准区间内，
        没有触发规则，所以没有可执行的动作。<b>这是好消息，不是数据丢了。</b><br>
        行动项只在<b>指标明显偏离基准</b>、或出现结构性问题时才会生成。</div>
      <div style="margin-top:11px;line-height:1.7">想核对逐条规则的判定依据 → 「单场诊断 → 问题诊断」<br>
        想看这场的指标离基准差多少 → 「单场诊断 → 转化漏斗」</div>
      <div style="margin-top:11px;display:flex;gap:8px">
        <button class="btn sm" onclick="go('report');setTab('issues')">看本场问题</button>
        <button class="btn sm" onclick="go('report');setTab('funnel')">看指标 vs 基准</button>
      </div>
    </div>`;
  }
  return `<div class="empty">
    <div style="font-weight:600;margin-bottom:6px">暂无待办</div>
    <div style="line-height:1.7">先去「单场诊断」看一场的结论，诊断命中的问题会自动转成这里的待办。</div>
    <div style="margin-top:11px"><button class="btn sm" onclick="go('report')">去看单场诊断</button></div>
  </div>`;
}

function renderTodoList(){
  if(!ST.todos.length) return todoEmptyHint();
  const manualCnt = ST.todos.filter(t=>t.manual).length;
  const doneCnt = ST.todos.filter(t=>t.done).length;
  const src = [];
  src.push('诊断自动 ' + (ST.todos.length - manualCnt) + ' 条');
  if(manualCnt) src.push('决策动作 ' + manualCnt + ' 条');
  return `<div class="note" style="font-size:11px;margin-bottom:9px">
    ${src.join(' · ')}${doneCnt?('　已完成 '+doneCnt+' 条'):''}　勾选会存到本机，刷新和切场次都不会丢。
  </div>` + ST.todos.map((t,i)=>`
    <div class="td">
      <input type="checkbox" id="td${i}" ${t.done?'checked':''} onchange="toggleTodo(${i})">
      <label class="td-b" for="td${i}">
        <div class="td-t">${esc(t.t)}</div>
        <div class="td-tags">
          <span class="tg ${String(t.p||'p2').toLowerCase()}">${t.p||'P2'}</span>
          <span class="tg">${esc(t.owner||'运营')}</span>
          <span class="tg">${t.from?esc(t.from):'决策动作'}</span>
        </div>
      </label>
    </div>`).join('');
}
/* 勾选：立刻落盘 + 立刻刷新 KPI。
   以前只改了内存里的布尔值 —— 上面的「已完成 / 完成率」纹丝不动，
   刷新或切到别的场次再回来，勾选还全被清空。 */
function toggleTodo(i){
  const t = ST.todos[i];
  if(!t) return;
  t.done = !t.done;
  const sid = ST.curId || '_';
  const st = tdLoad();
  if(t.done) st.done[tdKeyOf(sid, t.t)] = 1;
  else delete st.done[tdKeyOf(sid, t.t)];
  if(t.manual){
    const arr = st.manual[sid] || [];
    const hit = arr.filter(x=>x.t===t.t)[0];
    if(hit){ hit.done = t.done; st.manual[sid] = arr; }
  }
  tdSave(st);
  updateBadges();
  renderView('action');     // 重渲染，让 KPI 的「已完成 / 完成率」跟着动
  renderTopbar();
}
function copyTodos(){
  if(!ST.todos.length){ alert('当前没有待办项'); return; }
  const txt = ST.todos.map(t=>`[${t.p}][${t.owner}] ${t.t}`).join('\n');
  navigator.clipboard.writeText(txt).then(()=>alert('已复制 ' + ST.todos.length + ' 条行动项'),
    ()=>alert('复制失败，请手动选择'));
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtK(v){ v=v||0; return v>=10000 ? (v/10000).toFixed(1)+'万' : v.toLocaleString(); }

/* 载入某一场到诊断页 */
function loadSession(id){
  const rec = STORE.get(id);
  if(!rec){ alert('该场次不存在'); return; }
  if(!rec.raw){ alert('该场次缺少原始数据，无法重新分析'); return; }
  // 重解析，保证与当前引擎版本一致
  const blocks = splitBlocks(rec.raw);
  let recs=[], unk=[];
  blocks.forEach(b=>{
    const p = parseTable(parseDelimited(b));
    recs = recs.concat(p.records); unk = unk.concat(p.unknown||[]);
  });
  const M = normalize(recs, {category:rec.category});
  M.unknownFields = [...new Set(unk)].filter(Boolean);
  ST.M = M; ST.DIAG = runDiagnosis(M);
  ST.history = STORE.issueTrends();
  ST.curId = rec.id; ST.cat = rec.category;
  rebuildTodos();   // 必须放在 curId 之后（同上）

  ST.hostName = rec.hostName; ST.date = rec.date; ST.note = rec.note;
  ST.saveNote = null;          // 回执只属于「刚导入的那一次」，看历史场次时不该再显示
  ST.tab.report = 'overview';
  updateBadges();
  go('report');
}
function editSession(id){
  const rec = STORE.get(id);
  if(!rec) return;
  const host = prompt('主播名：', rec.hostName);
  if(host===null) return;
  const date = prompt('日期（YYYY-MM-DD）：', rec.date);
  if(date===null) return;
  const note = prompt('备注：', rec.note||'');
  if(note===null) return;
  STORE.update(id, {hostName:host.trim()||'未命名主播', date:date.trim()||rec.date, note:note.trim()});
  renderLibrary();
  updateBadges();
  renderTopbar();
}
/* 删除分两步：点「删」→ 该行按钮当场变成「确认删除 / 取消」→ 再点才真删。
   不用原生 confirm 的原因：浏览器屏蔽对话框时 confirm 静默返回 false，
   用户看到的就是「点了删除没反应」（隐私模式、部分手机浏览器、
   勾过「阻止此页面创建更多对话框」都会这样）。行内确认零依赖，任何环境都可靠。 */
function delSession(id){
  const rec = STORE.get(id);
  if(!rec){
    ST.delPending = null;
    ST.delNote = '这一场已不在库里（可能刚被删掉），列表已刷新';
    renderLibrary();
    return;
  }
  if(ST.delPending !== id){        // 第一步：进入待确认，立刻给出视觉反馈
    ST.delPending = id;
    ST.delNote = null;
    renderLibrary();
    return;
  }
  ST.delPending = null;            // 第二步：确认删除
  STORE.remove(id);
  tdForget(id);            // 连同这一场的待办勾选/手动项一起清掉，避免本机存储越积越脏
  if(ST.curId===id){ ST.curId=null; ST.M=null; ST.DIAG=null; ST.todos=[]; }
  ST.delNote = '已删除 '+rec.date+' · '+esc(rec.hostName)+' —— 不可恢复，其他场次不受影响';
  renderLibrary();
  updateBadges();
  renderTopbar();   // 顶栏「已存本机 N 场」也要跟着变，否则删空了还显示旧数字
}
function cancelDel(){
  ST.delPending = null;
  renderLibrary();
}

/* ==================== 场次对比（按维度分板块） ==================== */
function renderCompare(){
  const all = STORE.all();          // 最新在前
  const curId = ST.curId || (all[0] && all[0].id);
  const curRec = STORE.get(curId);
  const others = all.filter(x=>x.id!==curId);

  if(!curRec || !others.length){
    document.getElementById('scroll').innerHTML = `
      <div class="card"><div class="empty-lib">
        <div class="big">⇄</div>
        <div style="font-size:14px;color:var(--text-2);margin-bottom:6px">还没有可对比的场次</div>
        <div style="font-size:12px;line-height:1.7">
          对比至少需要 2 场。你已经存了 ${STORE.count()} 场。<br>
          再导入一场，这里就能看到「本场 vs 对比场 vs 历史均值」的差异。</div>
        <div class="mt12"><button class="btn pri" onclick="go('import')">再导入一场</button></div>
      </div></div>`;
    return;
  }

  // 对比对象：默认上一场
  const prevRec = STORE.previous(curId) || others[0];
  const cmpId = ST.compareId && STORE.get(ST.compareId) ? ST.compareId : prevRec.id;
  const cmpRec = STORE.get(cmpId);

  // 历史基准：排除本场
  const base = STORE.baseline(curId);
  const cur = curRec.snapshot;
  const prev = cmpRec.snapshot;
  const avg = k => (base && base[k]!=null) ? base[k] : 0;

  const metrics = [
    ['GMV','gmv','¥',false], ['UV价值','uv','¥',false], ['平均停留','stay','s',false],
    ['进入率','entry','%',false], ['成交转化率','cvr','%',false],
    ['退款率','refund','%',true], ['付费占比','paid','%',true],
  ];
  const nf = (k,v)=> k==='gmv' ? Math.round(v).toLocaleString() : (+v||0).toFixed(2);
  const pfx = p => p==='s'?'':p;
  const sfx = p => p==='s'?'s':'';

  const tab = curTab('compare');
  // 裁决板块自带对比对象选择器，独立渲染
  if(tab==='verdict'){
    document.getElementById('scroll').innerHTML = renderVerdict();
    return;
  }
  let h = cmpPicker(curRec, cmpRec, others, cmpId, base);
  let after = null;

  if(tab==='gap'){
    h += cmpKpi(cur, base, avg, metrics, pfx, sfx, nf);
    h += renderCompareInsight(curRec, cmpRec, base);
  } else if(tab==='detail'){
    h += cmpThreeCol(cur, prev, base, cmpRec, avg, metrics, pfx, sfx, nf);
    h += cmpAllList(all, curId);
  } else if(tab==='trend'){
    h += cmpTrendCard(all);
    after = () => drawStoreTrend(curId);
  }

  document.getElementById('scroll').innerHTML = h;
  if(after) requestAnimationFrame(after);
}

/* 板块 1：差距概览 —— KPI 四宫格 */
function cmpKpi(cur, base, avg, metrics, pfx, sfx, nf){
  let h = `<div class="grid g4">`;
  metrics.slice(0,4).forEach(([label,key,p,inv])=>{
    const v = cur[key]||0, a = avg(key);
    const gap = a ? (v-a)/a*100 : 0;
    const good = inv ? gap<0 : gap>0;
    const cls = Math.abs(gap)<3?'flat':(good?'down':'up');
    h += `<div class="kpi">
      <div class="kpi-l">${label} <span class="muted">vs ${base.__n} 场均值</span></div>
      <div class="kpi-v">${pfx(p)}${key==='gmv'?Math.round(v).toLocaleString():v.toFixed(2)}${sfx(p)}</div>
      <div class="kpi-d"><span class="${cls}">${Math.abs(gap)<3?'—':(gap>0?'▲':'▼')}${Math.abs(gap).toFixed(1)}%</span>
        <span class="muted">均值 ${pfx(p)}${nf(key,a)}${sfx(p)}</span></div>
    </div>`;
  });
  h += `</div>`;
  return h;
}

    const gapAvg = a ? (v-a)/a*100 : 0;

/* 对比结论：找出本场与对比场/均值差异最大的项 */
function renderCompareInsight(curRec, cmpRec, base){
  const cur = curRec.snapshot, prev = cmpRec.snapshot;
  const defs = [
    ['GMV','gmv','%',false], ['UV价值','uv','%',false], ['平均停留','stay','%',false],
    ['进入率','entry','%',false], ['成交转化率','cvr','%',false],
    ['退款率','refund','pp',true], ['付费占比','paid','pp',true],
  ];
  const diffs = defs.map(([label,key,unit,inv])=>{
    const v=cur[key]||0, p=prev[key]||0;
    const d = unit==='pp' ? (v-p) : (p ? (v-p)/p*100 : 0);
    return {label, key, unit, inv, d, v, p};
  }).filter(x=>Math.abs(x.d)>=1)
    .sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));

  let h = `<div class="note mt12"><b>对比结论</b>：本场（${curRec.date}）对比 ${cmpRec.date}，`;
  if(!diffs.length){
    h += `各项指标基本持平，波动在 1% 以内，说明这一场与上一场表现接近。`;
  } else {
    h += `差异最大的三项是 `;
    h += diffs.slice(0,3).map(x=>{
      const dir = x.d>0?'高':'低';
      const good = x.inv ? x.d<0 : x.d>0;
      const col = good?'var(--green)':'var(--red)';
      const val = x.unit==='pp' ? Math.abs(x.d).toFixed(1)+'pp' : Math.abs(x.d).toFixed(1)+'%';
      return `<b style="color:${col}">${x.label}${dir} ${val}</b>`;
    }).join(' · ');
    h += `。`;
    // 归因建议
    const worst = diffs.filter(x=>x.inv?x.d>0:x.d<0).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d))[0];
    if(worst){
      const advice = {
        stay:'停留是转化的前置指标——停留降通常意味着开场没留人或讲品节奏拖沓。',
        cvr:'转化率下滑多是话术、价格锚点或排品顺序的问题，不是流量问题。',
        refund:'退款率上升要查货品描述一致性，以及发货时效。',
        uv:'UV 价值下降说明同样流量变现更少，优先看排品与促单节奏。',
        entry:'进入率下降通常是封面/标题或投放人群的匹配度变差。',
        gmv:'GMV 是结果指标，要顺着停留→转化→客单这条链往下拆。',
        paid:'付费占比升高意味着自然流量在萎缩，长期会推高获客成本。',
      }[worst.key];
      if(advice) h += `<br>其中 <b>${worst.label}</b> 是本场最该先查的项：${advice}`;
      // 若历史基准也存在明显偏差，追加一句
      const baseGap = base && base[worst.key]!=null ? (worst.v - base[worst.key]) : 0;
      if(base && Math.abs(baseGap)>0){
        h += `<br>同时看历史：本场 ${worst.label} ${(+worst.v).toFixed(2)}，${base.__n} 场均值 ${(+base[worst.key]).toFixed(2)}，${baseGap>0?'高于':'低于'}均值 ${Math.abs(baseGap).toFixed(2)}${worst.unit==='pp'?'pp':'%'}。`;
      }
    }
  }
  h += `</div>`;
  return h;
}

/* ==================== 对比：结论与决策 ====================
   这是整个网站唯一直接回答「我该优化还是继续往下走」的地方。
   顺序刻意设计成：结论 → 依据 → 差距在哪环 → 具体动作。
============================================================ */

/* 计算本场决策（带缓存：本场/对比场/场次数变化时才重算） */
function cmpDecide(){
  const all = STORE.all();
  const curId = ST.curId || (all[0] && all[0].id);
  const curRec = STORE.get(curId);
  if(!curRec) return null;
  const others = all.filter(x=>x.id!==curId);
  if(!others.length) return null;

  const prevRec = STORE.previous(curId) || others[0];
  const cmpId = (ST.compareId && ST.compareId!==curId && STORE.get(ST.compareId))
    ? ST.compareId : prevRec.id;
  const key = curId + '|' + cmpId + '|' + all.length;
  if(ST._decKey === key && ST._dec) return ST._dec;

  const cmpRec = STORE.get(cmpId);
  const base = STORE.baseline(curId);
  // 趋势序列只取「到本场为止」——看历史场次时不能拿未来的数据当依据
  const seq = curRec.seq || 0;
  const ordered = STORE.ordered()
    .filter(x => (x.seq||0) <= seq)
    .map(x => x.snapshot);

  const d = decide(curRec.snapshot, cmpRec ? cmpRec.snapshot : null, base, ordered, {n:ordered.length});
  d._cur = curRec; d._cmp = cmpRec; d._base = base; d._ordered = ordered;
  ST._dec = d; ST._decKey = key;
  return d;
}

/* 把「结论与决策」里的动作一键加入行动清单（落盘，切场次/刷新都还在） */
function addDecideTodos(){
  const d = cmpDecide();
  if(!d){
    // 以前这里直接 return —— 连一句提示都没有，用户点了以为按钮坏了。
    // cmpDecide 返回 null 只有两种可能：仓库是空的，或只有一场（没有可比对象）。
    const n = STORE.count();
    alert(n < 2
      ? ('「结论与决策」要先有可比的两场才能给结论 —— 目前仓库里只有 ' + n + ' 场。\n\n'
         + '不过本场诊断已经自动生成了 ' + ST.todos.length + ' 条待办，往下看就能直接勾选。\n'
         + '再录一场之后，这里会出现「差距在哪 · 该优化还是继续走」的裁决和对应动作。')
      : '暂时拿不到可比数据 —— 请先到「场次库」确认至少有两场，并点开其中一场。');
    return;
  }
  const sid = ST.curId || '_';
  const st = tdLoad();
  const arr = st.manual[sid] || [];
  const existing = new Set((ST.todos||[]).map(t=>t.t));
  let added = 0;
  (d.actions||[]).forEach(a=>{
    if(!a || existing.has(a.do)) return;
    arr.push({t:a.do, p:a.p, owner:a.owner, from:'决策动作',
      why:a.why, target:a.target, how:a.how, done:false});
    existing.add(a.do);
    added++;
  });
  st.manual[sid] = arr;
  const ok = tdSave(st);
  rebuildTodos();
  updateBadges();
  renderTopbar();
  if(added){
    alert('已加入 ' + added + ' 条到行动清单，可在「行动清单 → 待办清单」查看和勾选。'
      + (ok ? '\n（已存到本机，刷新和切场次都不会丢）'
            : '\n⚠ 未能存到本机（浏览器存储可能被禁用或已满），本次打开期间可用。'));
  } else {
    alert('这 ' + ((d.actions||[]).length) + ' 条动作已经都在行动清单里了，去「行动清单」可以直接勾选。');
  }
}


/* 数值格式化：按各环的单位输出 */
function chainVal(x){
  if(x.v==null) return '—';
  if(x.unit==='%') return x.v.toFixed(x.d) + '%';
  if(x.unit==='s') return Math.round(x.v) + 's';
  if(x.pfx) return x.pfx + (+x.v).toFixed(x.d);
  return (+x.v).toFixed(x.d);
}
function chainBase(x){
  if(x.b==null) return null;
  if(x.unit==='%') return x.b.toFixed(x.d) + '%';
  if(x.unit==='s') return Math.round(x.b) + 's';
  if(x.pfx) return x.pfx + (+x.b).toFixed(x.d);
  return (+x.b).toFixed(x.d);
}

function renderVerdict(){
  const all = STORE.all();
  const curId = ST.curId || (all[0] && all[0].id);
  const curRec = STORE.get(curId);
  const d = cmpDecide();

  if(!curRec){
    return `<div class="card"><div class="empty-lib">
      <div class="big">★</div>
      <div style="font-size:14px;color:var(--text-2)">还没有可判断的场次</div>
      <div style="font-size:12px;margin-top:6px;line-height:1.7">先导入一场数据，这里才会给出结论。</div>
      <div class="mt12"><button class="btn pri" onclick="go('import')">去导入</button></div>
    </div></div>`;
  }
  const others = all.filter(x=>x.id!==curId);
  if(!d || !others.length){
    return `<div class="card"><div class="empty-lib">
      <div class="big">★</div>
      <div style="font-size:14px;color:var(--text-2)">只有 1 场，判断不了趋势</div>
      <div style="font-size:12px;margin-top:6px;line-height:1.7">
        这场已经记录下来了（${curRec.date}）。再导入第 2 场，这里就会给出<br>
        「比出了什么、差距在哪、该优化还是继续往下走」。</div>
      <div class="mt12"><button class="btn pri" onclick="go('import')">再导入一场</button></div>
    </div></div>`;
  }

  const v = d.verdict;
  const theme = {
    green:{fg:'var(--green)', bg:'var(--green-bg)', line:'var(--green-line)'},
    blue: {fg:'var(--blue)',  bg:'var(--blue-bg)',  line:'var(--blue-line)'},
    amber:{fg:'var(--amber)', bg:'var(--amber-bg)', line:'var(--amber-line)'},
    red:  {fg:'var(--red)',   bg:'var(--red-bg)',   line:'var(--red-line)'},
  }[v.level] || {fg:'var(--blue)', bg:'var(--blue-bg)', line:'var(--blue-line)'};

  let h = cmpPicker(curRec, d._cmp, others, d._cmp.id, d._base);

  /* ---- 1. 裁决卡 ---- */
  const slopeTxt = d.slope
    ? (d.slope.rel >= 0 ? '↑ 每场 +' : '↓ 每场 ') + d.slope.rel + '%'
    : '样本不足';
  h += `<div class="vcard" style="border-color:${theme.line};background:${theme.bg}">
    <div class="vk" style="color:${theme.fg}">本场裁决 · 已积累 ${d.sample} 场</div>
    <div class="vh" style="color:${theme.fg}">${v.label}${v.label.length<=6?'':'：'}${v.headline}</div>
    <div class="vr" style="color:var(--text-2)">${v.reason}</div>
    <div class="vmeta">
      <span>对比场：<b>${d._cmp.date} · ${esc(d._cmp.hostName)}</b></span>
      <span>历史基准：<b>${d._base && d._base.__n ? d._base.__n + ' 场均' : '尚无'}</b></span>
      <span>健康分走势：<b style="color:${theme.fg}">${slopeTxt}</b></span>
      <span>硬伤：<b style="color:${d.hard.length?'var(--red)':'var(--green)'}">${d.hard.length ? d.hard.length + ' 处' : '无'}</b></span>
    </div>
  </div>`;

  /* ---- 2. 链路拆解：差距在哪一环 ---- */
  h += `<div class="card">
    <div class="ch"><div class="ct">差距在哪一环 <span class="tagline">链路拆解</span></div>
      <div class="cs">每一环对照你自己的历史均值</div></div>
    <div class="chain">`;
  d.chain.forEach(x=>{
    const good = x.rank>1, bad = x.rank<0;
    const col = bad ? (x.state==='broken'?'var(--red)':'var(--amber)') : (good?'var(--green)':'var(--text-3)');
    const arrow = x.gap==null ? '' : (x.gap>0 ? '▲' : '▼');
    const gapTxt = x.gap==null ? '无可比基准' : (arrow + Math.abs(x.gap).toFixed(1) + '% · ' + x.stateLabel);
    h += `<div class="chain-i ${x.state}">
      <div class="chain-l">${x.label}</div>
      <div class="chain-v">${chainVal(x)}</div>
      <div class="chain-b">${chainBase(x) ? ('均值 ' + chainBase(x)) : '无基准'}</div>
      <div class="chain-g" style="color:${col}">${gapTxt}</div>
    </div>`;
  });
  // 先把三目结果算成变量再插值 —— 模板字符串的 ${} 里直接写带引号的三目极易出错
  const weakHint = d.weakest
    ? '你当前最该动的是 <b style="color:var(--red)">' + d.weakest.label + '</b>（' + d.weakest.stateLabel + '）：' + d.weakest.why
    : '各环都在正常区间，没有明显的断点。';
  h += `</div>
    <div class="note mt12" style="font-size:11px">
      链路是<b>「人进得来 → 留得住 → 卖得动 → 变现多」</b>。前端断了补话术没用，后端断了加流量也白费
      —— ${weakHint}
    </div>
  </div>`;

  /* ---- 3. 差距明细：比出了什么 ---- */
  h += `<div class="card mt12">
    <div class="ch"><div class="ct">比出了什么 <span class="tagline">两个口径</span></div>
      <div class="cs">vs 对比场 · vs ${d._base && d._base.__n ? d._base.__n + ' 场均' : '基准'}</div></div>
    <div class="tb-wrap"><table><thead><tr>
      <th>指标</th><th class="num">本场</th><th class="num">${esc(d._cmp.date)}</th>
      <th class="num">vs 对比场</th><th class="num">历史均值</th><th class="num">vs 均值</th>
    </tr></thead><tbody>`;

  // 展示全部指标（不只差异大的），保证是可核对的明细
  // 注意：解构出的位数参数不能叫 d —— 外层 d 是决策对象，同名会遮蔽掉它
  const allDefs = [
    ['GMV','gmv','¥',0,false], ['UV价值','uv','¥',2,false], ['平均停留','stay','',0,false],
    ['曝光进入率','entry','%',1,false], ['成交转化率','cvr','%',1,false],
    ['退款率','refund','%',1,true], ['付费占比','paid','%',1,true],
  ];
  const fmtV = (key,pfx,digits,val)=>{
    if(val==null) return '—';
    if(pfx==='¥') return '¥' + (key==='gmv' ? Math.round(val).toLocaleString() : (+val).toFixed(digits));
    return (+val).toFixed(digits) + pfx;
  };
  allDefs.forEach(([label,key,pfx,digits,inv])=>{
    const v0 = curRec.snapshot[key], c0 = d._cmp.snapshot[key], b0 = d._base ? d._base[key] : null;
    const gC = pctGap(v0, c0), gB = pctGap(v0, b0);
    const cell = (g,inverted)=>{
      if(g==null) return '<span class="muted">—</span>';
      const signed = inverted ? -g : g;
      const good = signed > 0;
      const col = Math.abs(g)<3 ? 'var(--text-3)' : (good ? 'var(--green)' : 'var(--red)');
      const mark = Math.abs(g)<3 ? '' : (g>0 ? '▲' : '▼');
      return `<span style="color:${col};font-weight:${Math.abs(g)>=3?600:400}">${mark}${Math.abs(g).toFixed(1)}%</span>`;
    };
    h += `<tr>
      <td>${label}</td>
      <td class="num" style="font-weight:600">${fmtV(key,pfx,digits,v0)}</td>
      <td class="num" style="color:var(--text-2)">${fmtV(key,pfx,digits,c0)}</td>
      <td class="num">${cell(gC,inv)}</td>
      <td class="num" style="color:var(--text-3)">${fmtV(key,pfx,digits,b0)}</td>
      <td class="num">${cell(gB,inv)}</td>
    </tr>`;
  });
  h += `</tbody></table></div>
    <div class="note mt12" style="font-size:11px">
      <b>怎么读这张表</b>：先看「vs 均值」——它是你和自己常规水平的差距，比跟单场比更可信；
      再看「vs 对比场」——它告诉你这两天之间发生了什么变化。两个口径都红，才是真问题。
      差额在 ±3% 以内视为持平，标灰不标色。
    </div>
  </div>`;

  /* ---- 4. 下一步动作 ---- */
  const pTag = {P0:'b-red', P1:'b-amber', P2:'b-blue'};
  const pDesc = {P0:'立即做', P1:'这周内', P2:'持续做'};
  h += `<div class="card mt12">
    <div class="ch"><div class="ct">下一步怎么做 <span class="tagline">${d.actions.length} 条</span></div>
      <button class="btn sm" onclick="addDecideTodos()">全部加入行动清单</button></div>`;
  d.actions.forEach(a=>{
    h += `<div class="act ${a.p.toLowerCase()}">
      <div class="act-h">
        <span class="badge ${pTag[a.p]||'b-blue'}">${a.p}</span>
        <span class="muted" style="font-size:10.5px">${pDesc[a.p]||''}</span>
        <span class="act-do">${a.do}</span>
        <span class="muted" style="margin-left:auto;white-space:nowrap;font-size:10.5px">责任人 ${a.owner}</span>
      </div>
      <div class="act-row"><b>怎么做</b>：${a.how}</div>
      <div class="act-row"><b>目标</b>：<span style="color:${theme.fg};font-weight:600">${a.target}</span></div>
      <div class="act-row" style="color:var(--text-3)"><b>为什么</b>：${a.why}</div>
    </div>`;
  });
  h += `</div>`;

  /* ---- 5. 方法说明（建立信任） ---- */
  h += `<div class="note mt12" style="font-size:11px;background:var(--surface-2)">
    <b>这套判断是怎么来的</b>：先看有没有硬伤（退款率 ≥15%、停留跌破均值 75%、付费占比 >55%），有就先止血；
    没有硬伤再看健康分的走势方向；再看本场是否低于自己的基准。
    只有在「趋势向上 + 本场不低于基准」同时成立时才会建议继续推进 ——
    所以如果系统说「保持节奏」，不是没分析，而是分析完认为不该乱动。
    <br>样本量：本场之前共 ${d.sample} 场${d.elasticity ? ('；停留→转化弹性实测 k='+d.elasticity.k+'（'+d.elasticity.n+' 场样本）') : '；停留→转化弹性样本还不足，收益估算按保守经验值折算'}。
  </div>`;

  return h;
}
